[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "som-core"
version = "0.1.0"
description = "Engine and CLI for the Snippet-Oriented Model (SOM): layer records and the reference assembler"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "mlx",
    "mlx-lm",
    "tokenizers>=0.23",
    "typer",
]

[project.scripts]
som-train = "som_core.train_v1:train"

[dependency-groups]
dev = [
    "pytest",
    "boto3==1.43.105",
    "httpx==0.28.1",
    "PyJWT==2.15.1",
    "redis==8.1.0",
    "SQLAlchemy==2.0.44",
]

[tool.setuptools.packages.find]
where = ["src"]
