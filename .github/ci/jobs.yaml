# Work Jobs of each CI stage. Format: aw docs/standards/ci-on-gke.md
version: 1
image: ghcr.io/faberline/ci-rust:1.96.1   # equals channel in rust-toolchain.toml
jobs:
  - name: fmt-clippy
    stage: lint
    command: |
      cd som-service
      cargo fmt --all -- --check
      cargo clippy --workspace --all-targets --locked -- -D warnings
    resources: { cpu: "1500m", memory: 5Gi }
    timeout: 15m

  - name: coverage
    stage: test
    command: |
      prefetch="$(mktemp -d)"
      mkdir -p "$prefetch/client/src" "$prefetch/client-v2/src" "$prefetch/server/src"
      sed 's/{{PACKAGE}}/som_client_prefetch/g' som-service/templates/Cargo.toml.txt > "$prefetch/client/Cargo.toml"
      sed 's/{{PACKAGE}}/som_client_prefetch/g' som-service/templates/Cargo.lock.txt > "$prefetch/client/Cargo.lock"
      : > "$prefetch/client/src/lib.rs"
      cargo fetch --locked --manifest-path "$prefetch/client/Cargo.toml"
      sed 's/{{PACKAGE}}/som_client_v2_prefetch/g' som-service/templates/client_v2_Cargo.toml.txt > "$prefetch/client-v2/Cargo.toml"
      sed 's/{{PACKAGE}}/som_client_v2_prefetch/g' som-service/templates/client_v2_Cargo.lock.txt > "$prefetch/client-v2/Cargo.lock"
      : > "$prefetch/client-v2/src/lib.rs"
      cargo fetch --locked --manifest-path "$prefetch/client-v2/Cargo.toml"
      sed 's/{{PACKAGE}}/som_server_prefetch/g' som-service/templates/server_Cargo.toml.txt > "$prefetch/server/Cargo.toml"
      : > "$prefetch/server/src/lib.rs"
      cargo fetch --manifest-path "$prefetch/server/Cargo.toml"
      cargo llvm-cov --manifest-path som-service/Cargo.toml --locked --json --summary-only --output-path som-service/target/coverage.json
      bash .github/ci/coverage-check.sh som-service/target/coverage.json aw.toml
    resources: { cpu: "1500m", memory: 5Gi }
    timeout: 30m

  - name: audit
    stage: test
    command: |
      cd som-service
      cargo deny --locked check
    resources: { cpu: "1500m", memory: 5Gi }
    timeout: 10m
