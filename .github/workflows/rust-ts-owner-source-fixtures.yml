name: TypeScript owner source qualification
on:
  push:
    branches: [codex/m12-ts-owner-source-fixtures-v3]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: som-ts-owner-source-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  HELPER_REVISION: ${{ github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: test_typescript_native_digests.py
            expected_tests: 8
          - path: test_typescript_regression_http_replay.py
            expected_tests: 13
          - path: test_typescript_regression_lifecycle.py
            expected_tests: 6
          - path: test_typescript_regression_main_replay.py
            expected_tests: 12
          - path: test_typescript_regression_owner.py
            expected_tests: 14
          - path: test_typescript_regression_product_proof.py
            expected_tests: 26
          - path: test_typescript_regression_raw_capture.py
            expected_tests: 5
          - path: test_typescript_regression_v2_contract.py
            expected_tests: 12
          - path: test_typescript_regression_v3_failures.py
            expected_tests: 11
          - path: test_typescript_regression_v3_replay.py
            expected_tests: 19
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and actual Python
        run: |
          test "$(git rev-parse HEAD)" = "$HELPER_REVISION"
          git rev-parse HEAD > tested-sha.txt
          python3 --version > python-version.txt 2>&1
      - name: Run every selected source fixture
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/${{ matrix.path }}" -v 2>&1 | tee source-fixtures.log
      - name: Retain complete source output and first failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ts-owner-source-${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30
          path: |
            tested-sha.txt
            python-version.txt
            source-fixtures.log
