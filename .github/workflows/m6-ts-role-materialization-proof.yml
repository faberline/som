name: M6 TypeScript draft input-role proof
on:
  push:
    branches: [codex/m6-ts-role-materialization-proof]
permissions:
  contents: read
jobs:
  roles:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check source identity and focused fixtures
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 -B -m unittest discover -s .github/m6-ts-role-materialization -p 'test_*.py' -v
      - name: Bind approved 19-package source
        run: |
          git fetch --no-tags --depth=1 origin 02cd9e79cdcedfef92816f67a3ccdf2e089964ab
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          commit='02cd9e79cdcedfef92816f67a3ccdf2e089964ab'
          raw=subprocess.check_output(['git','show',commit+':inputs-index.json'])
          sha=hashlib.sha256(raw).hexdigest()
          if sha!='6953812ebe0f388cefe77ec90e8659a8f70d6e8ccf9517f6417e7a3b9b774c28':raise SystemExit('input index refused')
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'input-config.json').write_text(json.dumps({'version':'som.m6-hosted-inputs.v1','commit':commit,'index_sha256':sha})+'\n')
          PY
      - name: Restore approved inputs in runner scratch
        env:
          M6_INPUTS_KEYRING: ${{ secrets.SOM_M6_ACCEPTANCE_INPUTS_V2 }}
        run: |
          python3 som-rs/scripts/react_output_acceptance/fetch_hosted_inputs.py --repo-root "$GITHUB_WORKSPACE" --config "$RUNNER_TEMP/input-config.json" --out "$RUNNER_TEMP/approved-inputs" --node "$(command -v node)" > /dev/null
      - name: Derive public Node npm source
        run: |
          python3 .github/m6-ts-role-materialization/derive_node_tools.py --pin som-rs/contracts/native-tools-v1/artifacts.json --out "$RUNNER_TEMP/node-tools" --metadata "$RUNNER_TEMP/node-inventory.json"
      - name: Materialize and verify complete draft role bytes
        run: |
          python3 .github/m6-ts-role-materialization/materialize_roles.py --profile .github/m6-ts-role-materialization/typescript-regression-input-profile-draft.json --approved "$RUNNER_TEMP/approved-inputs" --node-root "$RUNNER_TEMP/node-tools" --out "$RUNNER_TEMP/ts-role-output"
      - name: Preserve safe receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ts-role-materialization-draft-summary
          path: ${{ runner.temp }}/ts-role-output/materialization-receipt.json
          if-no-files-found: warn
          retention-days: 14
