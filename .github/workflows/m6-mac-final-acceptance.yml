name: M6 Mac final acceptance draft (blocked)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: m6-hosted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Frozen M6 tools and optional full acceptance
    if: github.event_name == 'workflow_dispatch' || (!contains(github.event.pull_request.labels.*.name, 'm6:replay-audit') && !contains(github.event.pull_request.labels.*.name, 'm6:rehearse-release'))
    # The retained baseline and these frozen bottles require macOS 26.
    # This is a compatibility run. Linux tool adaptation belongs to M12.
    runs-on: macos-26
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      # A label schedules a run. It does not grant permission to transfer data.
      # The controller applies it only after explicit human input approval.
      M6_ACCEPTANCE_REQUESTED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Keep unreviewed final adapter disabled
        run: |
          echo 'Final adapter remains disabled pending complete independent audit.' >&2
          exit 1
      - name: Record the source revision
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '%s\n' "$TESTED_SHA" > "$RUNNER_TEMP/m6-tested-sha.txt"
          python3 --version
      - name: Fetch the pinned public tool supplement
        # The public supplement is separate from the approved project inputs.
        # Its exact files still have to match every frozen tool hash.
        # Fetch it before installing tools changes any runner library links.
        # No secret is needed for these public third-party files.
        # Keep the fetch and the provision as separate failure stages.
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          config = json.loads(pathlib.Path('som-rs/scripts/react_output_acceptance/macos_bottles.json').read_bytes())
          supplement = config['frozen_file_supplement']
          if supplement['repository'] != 'faberline/som' or not re.fullmatch(r'[0-9a-f]{40}', supplement['commit']):
              raise SystemExit('invalid public tool supplement')
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', supplement['commit']], check=True)
          PY
      - name: Verify and install the frozen tool closure
        run: |
          python3 som-rs/scripts/react_output_acceptance/provision_macos.py --out "$RUNNER_TEMP/m6-provision"
      - name: Prepare the product Python environment
        run: |
          /opt/homebrew/opt/python@3.12/bin/python3.12 -m venv som-rs/runtime/acceptance-m3-venv
          som-rs/runtime/acceptance-m3-venv/bin/python -m pip install -r som-rs/scripts/react_output_acceptance/hosted_python_requirements.txt
          som-rs/runtime/acceptance-m3-venv/bin/python -m pip check
          som-rs/runtime/acceptance-m3-venv/bin/python -m pip freeze > "$RUNNER_TEMP/m6-python-dependencies.txt"
      - name: Fetch the approved 18-package inputs and original manifest revision
        run: |
          git fetch --no-tags --depth=1 origin 1de8f05430a72f8d76f6159786cca71b0ae1a911 55eb7f5c3b21d4f3b57eb721ab60c6aa97e10db3
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);current='1de8f05430a72f8d76f6159786cca71b0ae1a911';old='55eb7f5c3b21d4f3b57eb721ab60c6aa97e10db3'
          def blob(commit,name):return subprocess.check_output(['git','show',commit+':'+name])
          raw=blob(current,'inputs-index.json');old_raw=blob(old,'inputs-index.json')
          if hashlib.sha256(raw).hexdigest()!='c468ae2086e4d64847b93ad8da08aa3828f30989008db470519cd408e55b67bf' or hashlib.sha256(old_raw).hexdigest()!='78375feb14ed286ac5df4c52f13d5d1ae301b2057d5e3894edf0f36c2705c498':raise SystemExit('input index refused')
          (temp/'m6-final-input-config.json').write_text(json.dumps({'version':'som.m6-hosted-inputs.v1','commit':current,'index_sha256':hashlib.sha256(raw).hexdigest()})+'\n')
          destination=temp/'input-packages';destination.mkdir(mode=0o700);(destination/'inputs-index.json').write_bytes(old_raw)
          for item in json.loads(old_raw)['packages']:
              name=item['manifest']
              if not re.fullmatch(r'package-[0-9]{3}[.]manifest[.]json',name):raise SystemExit('manifest name refused')
              data=blob(old,name)
              if hashlib.sha256(data).hexdigest()!=item['manifest_sha256']:raise SystemExit('manifest refused')
              (destination/name).write_bytes(data)
          PY
      - name: Restore approved 18 packages
        env:
          M6_INPUTS_KEYRING: ${{ secrets.SOM_M6_ACCEPTANCE_INPUTS_V2 }}
        run: |
          som-rs/runtime/acceptance-m3-venv/bin/python som-rs/scripts/react_output_acceptance/fetch_hosted_inputs.py --repo-root "$GITHUB_WORKSPACE" --config "$RUNNER_TEMP/m6-final-input-config.json" --out "$RUNNER_TEMP/approved-inputs" --node /opt/homebrew/Cellar/node/26.5.0/bin/node
      - name: Independently verify the approved supplement
        run: python3 som-rs/scripts/react_output_acceptance/audit_supplement_provision.py
      - name: Download and verify approved encrypted evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/faberline/som/actions/artifacts/12843589912 > "$RUNNER_TEMP/metadata.json"
          gh api repos/faberline/som/actions/artifacts/12843589912/zip > "$RUNNER_TEMP/evidence.zip"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat, zipfile
          temp=pathlib.Path(os.environ['RUNNER_TEMP']); meta=json.loads((temp/'metadata.json').read_bytes()); run=meta.get('workflow_run',{})
          if (meta.get('id'),meta.get('name'),meta.get('size_in_bytes'),meta.get('digest'),meta.get('expired')) != (12843589912,'m6-sealed-raw-evidence',249935784,'sha256:33fbad9d63cfa257636384b9b7c10e1406f2306922e4f28e8189c79f703b041e',False): raise SystemExit('artifact metadata refused')
          if (run.get('id'),run.get('head_sha'),run.get('repository_id')) != (40743738705,'40cffc13b3bff35e3ea5804b9f43a49cdef7b3c0',1390374878): raise SystemExit('artifact origin refused')
          archive=temp/'evidence.zip'
          with archive.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
          if archive.stat().st_size != 249935784 or digest != '33fbad9d63cfa257636384b9b7c10e1406f2306922e4f28e8189c79f703b041e': raise SystemExit('artifact bytes refused')
          dest=temp/'evidence-sealed'; dest.mkdir(mode=0o700)
          with zipfile.ZipFile(archive) as z:
              members=z.infolist(); names=[m.filename for m in members]
              expected={'evidence-index.json'} | {f'package-{i:03d}.{s}' for i in range(23) for s in ('sealed','manifest.json')}
              if len(set(names))!=len(names) or set(names)!=expected or sum(m.file_size for m in members)>512*1024*1024: raise SystemExit('artifact members refused')
              for m in members:
                  if stat.S_IFMT(m.external_attr>>16) not in (0,stat.S_IFREG) or not 0<=m.file_size<=128*1024*1024: raise SystemExit('artifact member refused')
                  with z.open(m) as source, (dest/m.filename).open('xb') as target:
                      count=0
                      while chunk:=source.read(1024*1024):
                          count+=len(chunk)
                          if count>m.file_size: raise SystemExit('artifact length refused')
                          target.write(chunk)
                      if count!=m.file_size: raise SystemExit('artifact length refused')
          if hashlib.sha256((dest/'evidence-index.json').read_bytes()).hexdigest()!='3759239392208eab81bf740ca9ca2a41465be3e3e4995de2bd255774f4596bea': raise SystemExit('evidence index refused')
          PY
      - name: Restore the approved later capture in runner scratch
        env:
          M6_INPUTS_KEYRING: ${{ secrets.SOM_M6_ACCEPTANCE_INPUTS_V2 }}
        run: |
          /opt/homebrew/Cellar/node/26.5.0/bin/node som-rs/scripts/react_output_acceptance/restore_hosted_evidence.mjs --root "$RUNNER_TEMP/evidence-sealed" --out "$RUNNER_TEMP/evidence" --index-sha256 3759239392208eab81bf740ca9ca2a41465be3e3e4995de2bd255774f4596bea > /dev/null
      - name: Verify and install the 668 derived pairs
        run: |
          scripts=som-rs/scripts/react_output_acceptance
          map="$scripts/historical-response-reuse-map.json"
          python3 "$scripts/reconstruct_historical_responses.py" --map "$map" --input-packages "$RUNNER_TEMP/input-packages" --input-root "$RUNNER_TEMP/approved-inputs" --evidence-packages "$RUNNER_TEMP/evidence-sealed" --evidence-root "$RUNNER_TEMP/evidence" --out "$RUNNER_TEMP/m6-derived"
          python3 "$scripts/verify_historical_response_provenance.py" --map "$map" --evidence-packages "$RUNNER_TEMP/evidence-sealed" --evidence-root "$RUNNER_TEMP/evidence"
          python3 "$scripts/install_derived_inputs.py" --map "$map" --inputs "$RUNNER_TEMP/approved-inputs" --derived "$RUNNER_TEMP/m6-derived"
          test ! -e .local
          test ! -L .local
          mv "$RUNNER_TEMP/approved-inputs/.local" .local
          chmod -R a-w .local/react-output/npm-cache-001 .local/typescript-output/npm-cache-001
      - name: Fetch public crates before offline verification
        if: env.M6_ACCEPTANCE_REQUESTED == 'true'
        env:
          CARGO_NET_OFFLINE: 'false'
        run: |
          for manifest in som-rs/Cargo.toml som-rs/som-targets/Cargo.toml; do
            /opt/homebrew/Cellar/rust/1.96.1/bin/cargo fetch --locked --manifest-path "$manifest"
          done
      - name: Run one candidate and the independent audit
        if: env.M6_ACCEPTANCE_REQUESTED == 'true'
        run: |
          som-rs/runtime/acceptance-m3-venv/bin/python som-rs/scripts/react_output_acceptance/run_hosted_acceptance.py --out .local/m6-hosted/acceptance --candidate-revision "$GITHUB_SHA" --approved-input-config "$RUNNER_TEMP/m6-final-input-config.json" --provenance-root "$RUNNER_TEMP"
      - name: Seal the raw evidence
        if: always() && env.M6_ACCEPTANCE_REQUESTED == 'true'
        env:
          M6_INPUTS_KEYRING: ${{ secrets.SOM_M6_ACCEPTANCE_INPUTS_V2 }}
        run: |
          if [ -d .local/m6-hosted/acceptance ]; then
            /opt/homebrew/Cellar/node/26.5.0/bin/node som-rs/scripts/react_output_acceptance/seal_hosted_evidence.mjs --root "$GITHUB_WORKSPACE/.local/m6-hosted/acceptance" --out "$RUNNER_TEMP/m6-sealed-evidence"
          fi
      - name: Prepare the safe acceptance summary
        if: always()
        run: |
          if [ ! -f .local/m6-hosted/acceptance/summary.json ]; then
            exit 0
          fi
          som-rs/runtime/acceptance-m3-venv/bin/python - <<'PY'
          import json, os, pathlib
          source = pathlib.Path('.local/m6-hosted/acceptance/summary.json')
          if source.is_file():
              record = json.loads(source.read_bytes())
              names = ('version', 'passed', 'status', 'failed_stage', 'product_suites', 'head_before', 'head_after', 'baseline_binary_sha256', 'candidate_binary_sha256', 'reconstructed_inputs_receipt_sha256', 'bootstrap_assets_receipt_sha256', 'step_count', 'audit_totals', 'acceptance_exit_code', 'audit_exit_code', 'cleanup')
              target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'm6-acceptance-summary.json'
              target.write_text(json.dumps({name: record[name] for name in names if name in record}, indent=2) + '\n')
          PY
      - name: Keep the safe stage summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m6-hosted-summaries
          path: |
            ${{ runner.temp }}/m6-tested-sha.txt
            ${{ runner.temp }}/m6-provision/report.json
            ${{ runner.temp }}/m6-python-dependencies.txt
            ${{ runner.temp }}/approved-inputs/provision.json
            ${{ runner.temp }}/m6-acceptance-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Keep encrypted raw evidence
        if: always() && env.M6_ACCEPTANCE_REQUESTED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m6-sealed-raw-evidence
          path: ${{ runner.temp }}/m6-sealed-evidence/
          if-no-files-found: warn
          retention-days: 30
