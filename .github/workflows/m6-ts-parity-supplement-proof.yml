name: M6 approved Rust parity supplement proof
on:
  push:
    branches: [codex/m6-ts-parity-proof-20261029]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  provision:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind approved input indexes and single-file manifest
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=1 origin 1de8f05430a72f8d76f6159786cca71b0ae1a911 02cd9e79cdcedfef92816f67a3ccdf2e089964ab
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          old='1de8f05430a72f8d76f6159786cca71b0ae1a911';new='02cd9e79cdcedfef92816f67a3ccdf2e089964ab'
          def blob(commit,name): return subprocess.check_output(['git','show',commit+':'+name])
          before=blob(old,'inputs-index.json');after=blob(new,'inputs-index.json');manifest=blob(new,'package-018.manifest.json')
          h=lambda raw:hashlib.sha256(raw).hexdigest()
          if h(before)!='c468ae2086e4d64847b93ad8da08aa3828f30989008db470519cd408e55b67bf' or h(after)!='6953812ebe0f388cefe77ec90e8659a8f70d6e8ccf9517f6417e7a3b9b774c28' or h(manifest)!='77e8548a4f0922f1df543869f296d3101dc9deca53a786c74a75f4d5d5fb939a':raise SystemExit('input authority refused')
          prev,cur,doc=json.loads(before),json.loads(after),json.loads(manifest)
          name='.local/rust-compiler-goal/acceptance/rust-output-055/run-003/behavior/parity/report-parity.json'
          if len(prev['packages'])!=18 or len(cur['packages'])!=19 or cur['packages'][:18]!=prev['packages'] or len(doc['files'])!=1:raise SystemExit('package scope refused')
          f=doc['files'][0]
          if (f['path'],f['sha256'],f['bytes'],f['mode'])!=(name,'db0f8bafa27f39acd6a8a98994110706142e124278c86e2ad87e8a56e18beca6',78107,420):raise SystemExit('source member refused')
          config={'version':'som.m6-hosted-inputs.v1','commit':new,'index_sha256':h(after)}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'parity-input-config.json').write_text(json.dumps(config)+'\n')
          PY
      - name: Restore approved encrypted packages in runner scratch
        env:
          M6_INPUTS_KEYRING: ${{ secrets.SOM_M6_ACCEPTANCE_INPUTS_V2 }}
        run: |
          python3 som-rs/scripts/react_output_acceptance/fetch_hosted_inputs.py --repo-root "$GITHUB_WORKSPACE" --config "$RUNNER_TEMP/parity-input-config.json" --out "$RUNNER_TEMP/approved-inputs" --node "$(command -v node)" > /dev/null
      - name: Verify restored single report
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,stat
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'approved-inputs'
          p=root/'.local/rust-compiler-goal/acceptance/rust-output-055/run-003/behavior/parity/report-parity.json'
          if p.is_symlink() or not p.is_file() or p.stat().st_size!=78107 or stat.S_IMODE(p.stat().st_mode)!=0o644 or hashlib.sha256(p.read_bytes()).hexdigest()!='db0f8bafa27f39acd6a8a98994110706142e124278c86e2ad87e8a56e18beca6':raise SystemExit('restored member differs')
          print(json.dumps({'package_count':19,'supplement_files':1,'source_sha256':'db0f8bafa27f39acd6a8a98994110706142e124278c86e2ad87e8a56e18beca6','product_acceptance':'not_run'},sort_keys=True))
          PY
