# CI stages: lint -> test -> e2e -> gate.
# See https://github.com/faberline/aw/blob/main/docs/standards/ci.md
# The ruleset requires only the "gate" job. Keep its name fixed.
#
# Known exception: som-rs and som-rs/som-targets are not in lint. Their source is
# sealed by hashes in contracts/compiler-v1/ and scripts/; fmt and clippy fixes
# there need a user-approved amendment (issue #180). They are still tested.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: "lint: fmt, clippy"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: som-service
      - name: "fmt: som-service"
        working-directory: som-service
        run: cargo fmt --all -- --check
      - name: "clippy: som-service"
        working-directory: som-service
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-som-service:
    name: "test: som-service"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: som-service
      - name: Prefetch generated client dependencies
        run: |
          dir="$RUNNER_TEMP/som-client-prefetch"
          mkdir -p "$dir/src"
          sed 's/{{PACKAGE}}/som_client_prefetch/g' som-service/templates/Cargo.toml.txt > "$dir/Cargo.toml"
          sed 's/{{PACKAGE}}/som_client_prefetch/g' som-service/templates/Cargo.lock.txt > "$dir/Cargo.lock"
          : > "$dir/src/lib.rs"
          cargo fetch --locked --manifest-path "$dir/Cargo.toml"
      - name: "test: som-service"
        run: cargo test --manifest-path som-service/Cargo.toml --locked

  test-audit:
    name: "test: som-service, dependency audit"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.18.3
      - name: "audit: cargo deny"
        working-directory: som-service
        run: cargo deny --locked check

  test-som-rs:
    name: "test: som-rs"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.96.1
      CARGO_BUILD_JOBS: 2
      HELPER_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            som-rs
            som-rs/som-targets
      - name: Fetch locked public crates
        run: |
          cargo fetch --locked --manifest-path som-rs/Cargo.toml
          cargo fetch --locked --manifest-path som-rs/som-targets/Cargo.toml
      - name: Provision verified native tools
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/provision_native.py -- \
            --manifest som-rs/contracts/native-tools-v1/artifacts.json \
            --out "$RUNNER_TEMP/som-native-tools" \
            --rustfmt "$(rustup which rustfmt)"
          cat "$RUNNER_TEMP/som-native-tools/github.env" >> "$GITHUB_ENV"
      - name: Package compiler assets from tracked source
        run: |
          cargo run --locked --offline --manifest-path som-rs/Cargo.toml \
            --bin som-compiler-assets -- \
            --destination som-rs/compiler-assets/current \
            --formatter "$SOM_RUFF"
      - name: "test: som-rs compiler"
        run: cargo test --locked --offline --no-fail-fast --manifest-path som-rs/Cargo.toml -- --test-threads=1
      - name: "test: som-rs targets"
        run: cargo test --locked --offline --no-fail-fast --manifest-path som-rs/som-targets/Cargo.toml -- --test-threads=1

  test-scripts:
    name: "test: python and node scripts"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Quickstart unit tests
        run: python3 -m unittest discover -s som-rs/scripts/react_quickstart -p 'test_*.py' -v
      - name: Acceptance runner unit tests (Python)
        run: python3 -I -S -B -m unittest discover -s som-rs/scripts/react_output_acceptance -p 'test_*.py' -v
      - name: Acceptance runner unit tests (Node)
        run: node --test som-rs/scripts/react_output_acceptance/test_*.mjs
      - name: Audit unit tests
        run: python3 -m unittest discover -s som-rs/scripts/react_output_acceptance/audit -p 'test_*.py' -v
      - name: Release tool unit tests
        run: |
          python3 -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install 'jsonschema==4.25.1' 'psycopg[binary]==3.2.10' 'referencing==0.36.2' 'alembic==1.16.5' 'SQLAlchemy==2.0.44'
          "$RUNNER_TEMP/release-venv/bin/python" -m unittest discover -s som-rs/scripts/rust_output_release -p 'test_*.py' -v

  gate:
    name: gate
    if: always()
    needs: [lint, test-som-service, test-audit, test-som-rs, test-scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every stage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.lint.result == "success"' > /dev/null
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
