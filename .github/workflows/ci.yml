# CI stages: lint -> test -> e2e -> gate.
# See https://github.com/faberline/aw/blob/main/docs/standards/ci.md
# The ruleset requires only the "gate" job. Keep its name fixed.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    permissions: { id-token: write, contents: read, packages: read }
    uses: faberline/aw/.github/workflows/ci-stage.yml@main
    with:
      stage: lint
      timeout-minutes: 40

  test-gke:
    name: test
    needs: [lint]
    permissions: { id-token: write, contents: read, packages: read }
    uses: faberline/aw/.github/workflows/ci-stage.yml@main
    with:
      stage: test
      timeout-minutes: 65

  test-perf:
    name: "test: performance gate and coverage base"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: 1.96.1
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: som-service
      - name: "perf gate: som-service"
        working-directory: som-service
        run: SOM_PERF_GATE=1 cargo test --release --locked --test it perf_gate -- --test-threads=1
      - name: "coverage ratchet: base line (COV5)"
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/aw.toml?ref=$BASE_REF" 2>/dev/null | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read()).get("standards", {}).get("coverage", {}).get("line", ""))' || true)"
          head="$(python3 -c 'import tomllib; print(tomllib.load(open("aw.toml", "rb"))["standards"]["coverage"]["line"])')"
          echo "line $head, base line ${base:-none}"
          python3 -c 'import sys; b, h = sys.argv[1:]; sys.exit(0 if b == "" or float(h) >= float(b) else 1)' "$base" "$head"

  gate:
    name: gate
    if: always()
    needs: [lint, test-gke, test-perf]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every stage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.lint.result == "success"' > /dev/null
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
