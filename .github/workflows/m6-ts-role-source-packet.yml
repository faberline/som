name: M6 TypeScript draft sealed-role transport proof
on:
  push:
    branches: [codex/m6-ts-artifact-join-proof]
permissions:
  contents: read
  actions: read
jobs:
  roles:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      producer_catalog: ${{ steps.origin.outputs.producer_catalog }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Check source and run bounded fixtures
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 -B -m unittest discover -s .github/m6-ts-role-transport -p 'test_*.py' -v
      - name: Bind approved 19-package input index
        run: |
          git fetch --no-tags --depth=1 origin 02cd9e79cdcedfef92816f67a3ccdf2e089964ab
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          commit='02cd9e79cdcedfef92816f67a3ccdf2e089964ab'
          raw=subprocess.check_output(['git','show',commit+':inputs-index.json'])
          sha=hashlib.sha256(raw).hexdigest()
          if sha!='6953812ebe0f388cefe77ec90e8659a8f70d6e8ccf9517f6417e7a3b9b774c28':raise SystemExit('input index refused')
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'input-config.json').write_text(json.dumps({'version':'som.m6-hosted-inputs.v1','commit':commit,'index_sha256':sha})+'\n')
          PY
      - name: Restore approved inputs in runner scratch
        env:
          M6_INPUTS_KEYRING: ${{ secrets.SOM_M6_ACCEPTANCE_INPUTS_V2 }}
        run: |
          python3 som-rs/scripts/react_output_acceptance/fetch_hosted_inputs.py --repo-root "$GITHUB_WORKSPACE" --config "$RUNNER_TEMP/input-config.json" --out "$RUNNER_TEMP/approved-inputs" --node "$(command -v node)" > /dev/null
      - name: Derive official Node npm source
        run: |
          python3 .github/m6-ts-role-transport/derive_node_tools.py --pin som-rs/contracts/native-tools-v1/artifacts.json --out "$RUNNER_TEMP/node-tools" --metadata "$RUNNER_TEMP/node-inventory.json"
      - name: Reconstruct the exact frozen npm closure
        env:
          npm_config_offline: 'true'
          npm_config_audit: 'false'
          npm_config_fund: 'false'
          npm_config_update_notifier: 'false'
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://registry.npmjs.org/npm/-/npm-11.17.0.tgz --output "$RUNNER_TEMP/npm.tgz"
          test "$(shasum -a 256 "$RUNNER_TEMP/npm.tgz" | cut -d ' ' -f 1)" = b290bbb35b9e72c3ef84edbe041f28c4479c4d9ee79f555817b8caafe7ce4bba
          mkdir "$RUNNER_TEMP/bootstrap" "$RUNNER_TEMP/npm-prefix"
          tar -xzf "$RUNNER_TEMP/npm.tgz" --strip-components=1 -C "$RUNNER_TEMP/bootstrap"
          PATH="$RUNNER_TEMP/node-tools/bin:/usr/bin:/bin" "$RUNNER_TEMP/node-tools/bin/node" "$RUNNER_TEMP/bootstrap/bin/npm-cli.js" install --global --prefix "$RUNNER_TEMP/npm-prefix" "$RUNNER_TEMP/npm.tgz" > "$RUNNER_TEMP/npm-install.log" 2>&1
          cp "$RUNNER_TEMP/bootstrap/package.json" "$RUNNER_TEMP/npm-prefix/lib/node_modules/npm/package.json"
          printf 'prefix = /opt/homebrew\n' > "$RUNNER_TEMP/npm-prefix/lib/node_modules/npm/npmrc"
          python3 .github/m6-ts-role-transport/rebuild_npm_pyc.py --root "$RUNNER_TEMP/npm-prefix/lib/node_modules/npm" --metadata "$GITHUB_WORKSPACE/.github/m6-ts-role-transport/npm-pyc-rebuild-metadata.json"
          test "$(python3 som-rs/tests/typescript-output-v1/tree_sha.py "$RUNNER_TEMP/npm-prefix/lib/node_modules/npm")" = '3a9e0a20999d2a5c9727e911c554cd66230dba9a169fe0f0a6a54bd3dc7f9186 files=1957 symlinks=9'
          python3 - <<'PY'
          import os,pathlib,shutil
          temp=pathlib.Path(os.environ['RUNNER_TEMP']); dest=temp/'node-tools/lib/node_modules/npm'
          dest.parent.mkdir(parents=True,exist_ok=True)
          shutil.copytree(temp/'npm-prefix/lib/node_modules/npm',dest,symlinks=True)
          PY
      - name: Materialize and bind draft source roles
        run: |
          mkdir -m 700 "$RUNNER_TEMP/packet"
          python3 .github/m6-ts-role-transport/materialize_roles.py --profile "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/inputs/typescript-regression-inputs-v1.json" --approved "$RUNNER_TEMP/approved-inputs" --node-root "$RUNNER_TEMP/node-tools" --out "$RUNNER_TEMP/packet/run"
      - name: Split the verified Node binary for bounded transport
        run: python3 .github/m6-ts-role-transport/node_chunk_transport.py split --run "$RUNNER_TEMP/packet/run"
      - name: Preserve the complete Node npm tree in a bounded archive
        run: python3 .github/m6-ts-role-transport/node_role_transport.py pack --profile "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/inputs/typescript-regression-inputs-v1.json" --run "$RUNNER_TEMP/packet/run"
      - name: Seal all draft role bytes
        id: seal
        env:
          M6_INPUTS_KEYRING: ${{ secrets.SOM_M6_ACCEPTANCE_INPUTS_V2 }}
        run: |
          node som-rs/scripts/react_output_acceptance/seal_hosted_evidence.mjs --root "$RUNNER_TEMP/packet" --out "$RUNNER_TEMP/role-sealed"
          index_sha="$(shasum -a 256 "$RUNNER_TEMP/role-sealed/evidence-index.json" | cut -d ' ' -f 1)"
          printf 'index_sha256=%s\n' "$index_sha" >> "$GITHUB_OUTPUT"
      - name: Restore sealed role bytes in runner scratch
        env:
          M6_INPUTS_KEYRING: ${{ secrets.SOM_M6_ACCEPTANCE_INPUTS_V2 }}
        run: |
          index_sha="$(shasum -a 256 "$RUNNER_TEMP/role-sealed/evidence-index.json" | cut -d ' ' -f 1)"
          node som-rs/scripts/react_output_acceptance/restore_hosted_evidence.mjs --root "$RUNNER_TEMP/role-sealed" --out "$RUNNER_TEMP/role-restored" --index-sha256 "$index_sha" > /dev/null
      - name: Reassemble Node and verify all restored role bytes
        run: |
          python3 .github/m6-ts-role-transport/node_role_transport.py restore --profile "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/inputs/typescript-regression-inputs-v1.json" --run "$RUNNER_TEMP/role-restored/run"
          python3 .github/m6-ts-role-transport/node_chunk_transport.py restore --run "$RUNNER_TEMP/role-restored/run"
          python3 .github/m6-ts-role-transport/verify_restored_roles.py --profile "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/inputs/typescript-regression-inputs-v1.json" --run "$RUNNER_TEMP/role-restored/run"
      - name: Retain encrypted draft transport only
        id: upload
        if: ${{ always() && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: same-candidate-typescript-regression-inputs
          path: ${{ runner.temp }}/role-sealed/
          if-no-files-found: error
          retention-days: 14
      - name: Bind exact same-run artifact metadata and ZIP bytes
        if: ${{ steps.upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          UPLOAD_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          gh api "repos/faberline/som/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/role-artifact.json"
          gh api "repos/faberline/som/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/role-artifact.zip"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);meta=json.loads((temp/'role-artifact.json').read_bytes());origin=meta['workflow_run']
          archive=temp/'role-artifact.zip'
          with archive.open('rb') as stream:digest=hashlib.file_digest(stream,'sha256').hexdigest()
          if meta['id']!=int(os.environ['ARTIFACT_ID']) or meta['name']!='same-candidate-typescript-regression-inputs' or meta['expired'] or meta['digest']!='sha256:'+digest or os.environ['UPLOAD_DIGEST'].removeprefix('sha256:')!=digest or origin['id']!=int(os.environ['GITHUB_RUN_ID']) or origin['head_sha']!=os.environ['GITHUB_SHA'] or origin['repository_id']!=1390374878:raise SystemExit('artifact origin or bytes differ')
          print(json.dumps({'artifact_id':meta['id'],'artifact_sha256':digest,'artifact_bytes':archive.stat().st_size,'product_acceptance':'not_run'},sort_keys=True))
          PY
      - name: Independently extract the actual uploaded encrypted ZIP
        env:
          UPLOAD_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          INDEX_SHA: ${{ steps.seal.outputs.index_sha256 }}
        run: |
          python3 .github/m6-ts-role-transport/extract_uploaded_artifact.py --zip "$RUNNER_TEMP/role-artifact.zip" --out "$RUNNER_TEMP/uploaded-sealed" --zip-sha256 "${UPLOAD_DIGEST#sha256:}" --index-sha256 "$INDEX_SHA"
      - name: Restore and verify roles from the downloaded artifact
        env:
          M6_INPUTS_KEYRING: ${{ secrets.SOM_M6_ACCEPTANCE_INPUTS_V2 }}
          INDEX_SHA: ${{ steps.seal.outputs.index_sha256 }}
        run: |
          node som-rs/scripts/react_output_acceptance/restore_hosted_evidence.mjs --root "$RUNNER_TEMP/uploaded-sealed" --out "$RUNNER_TEMP/uploaded-restored" --index-sha256 "$INDEX_SHA" > /dev/null
          python3 .github/m6-ts-role-transport/node_role_transport.py restore --profile "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/inputs/typescript-regression-inputs-v1.json" --run "$RUNNER_TEMP/uploaded-restored/run"
          python3 .github/m6-ts-role-transport/node_chunk_transport.py restore --run "$RUNNER_TEMP/uploaded-restored/run"
          python3 .github/m6-ts-role-transport/verify_restored_roles.py --profile "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/inputs/typescript-regression-inputs-v1.json" --run "$RUNNER_TEMP/uploaded-restored/run"
      - name: Bind receipt and live artifact origin
        id: origin
        if: ${{ steps.upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          UPLOAD_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          INDEX_SHA: ${{ steps.seal.outputs.index_sha256 }}
        run: |
          python3 .github/m6-ts-role-transport/bind_restored_inputs.py --profile "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/inputs/typescript-regression-inputs-v1.json" --run "$RUNNER_TEMP/uploaded-restored/run" --artifact-id "$ARTIFACT_ID" --upload-digest "$UPLOAD_DIGEST" --archive "$RUNNER_TEMP/role-artifact.zip" --index-sha256 "$INDEX_SHA" --receipt "$RUNNER_TEMP/restored-inputs-receipt.json" --context "$RUNNER_TEMP/typescript-input-context.json"
  catalog-check:
    needs: roles
    runs-on: ubuntu-24.04
    env:
      PRODUCER_CATALOG: ${{ needs.roles.outputs.producer_catalog }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Independently check trusted producer job output
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          c=json.loads(os.environ['PRODUCER_CATALOG'])
          required={'version','job','run_id','run_attempt','head_sha','artifact_id','artifact_digest','index_sha256','receipt_sha256','profile_sha256'}
          assert set(c)==required and c['version']=='som.ts-input-producer-catalog-draft.v1' and c['job']=='roles'
          assert c['run_id']==os.environ['GITHUB_RUN_ID'] and c['run_attempt']==os.environ['GITHUB_RUN_ATTEMPT'] and c['head_sha']==os.environ['GITHUB_SHA']
          assert all(re.fullmatch('[0-9a-f]{64}',c[k]) for k in ('index_sha256','receipt_sha256','profile_sha256'))
          meta=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/'+str(c['artifact_id'])]))
          assert meta['id']==c['artifact_id'] and meta['name']=='same-candidate-typescript-regression-inputs' and not meta['expired'] and meta['digest']==c['artifact_digest']
          assert str(meta['workflow_run']['id'])==c['run_id'] and meta['workflow_run']['head_sha']==c['head_sha']
          print(json.dumps({'status':'trusted-job-output-checked-draft','artifact_id':c['artifact_id'],'run_attempt':c['run_attempt'],'product_acceptance':'not_run'}))
          PY
