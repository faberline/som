name: M6 release supervision fixture (not product acceptance)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run controlled wait and timeout fixtures
        run: python3 som-rs/scripts/rust_output_release/test_rehearsal_supervision.py -v
      - name: Run existing compiler rehearsal fixtures
        run: python3 -m unittest discover -s som-rs/scripts/rust_output_release -p 'test_compiler*.py' -v
