name: M6 compatibility prototype fixtures (not acceptance)
on:
  push:
    branches:
      - 'codex/m6-compat-prototype-20261029'
permissions:
  contents: read
jobs:
  synthetic-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test unused strict-only scratch adapter
        working-directory: .github/m6-native-compat-prototype
        run: python3 -m unittest -v test_strict_adapter
