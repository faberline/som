name: M6 compatibility prototype fixtures (not acceptance)
on:
  push:
    branches:
      - 'codex/m6-compat-prototype-20261029'
permissions:
  contents: read
jobs:
  synthetic-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test unused synthetic-only comparison algorithms
        working-directory: .github/m6-native-compat-prototype
        env:
          SOM_SYNTHETIC_RAW_HELPER: ${{ github.workspace }}/som-rs/scripts/hosted_readiness/raw_digest_compat.py
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest -v test_strict_adapter test_synthetic_only
      - name: Test React historical source binding experiment
        working-directory: .github/m6-react-source-binding
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest -v test_react_source_snapshot
