name: M6 React product raw evidence fixtures (not acceptance)
on:
  push:
    branches:
      - codex/m6-react-gates-raw-fixtures-20261029
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run product raw evidence synthetic fixtures
        working-directory: .github/m6-react-product-gates-evidence
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest -v test_linux_qa_profile test_run_gates_profile test_raw_evidence
