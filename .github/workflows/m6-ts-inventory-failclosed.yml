name: TypeScript role inventory fail-closed check
on:
  push:
    branches: [codex/m6-ts-inventory-failclosed-proof]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -B -m unittest discover -s .github/m6-ts-role-transport -p 'test_role_inventory.py' -v
