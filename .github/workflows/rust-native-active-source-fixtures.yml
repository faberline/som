name: Native active source fixtures
on:
  push:
    branches: [codex/m12-native-converged-source-fixtures-v1]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  HELPER_REVISION: ${{ github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-fixtures:
    name: source-fixtures (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native-host-fragments
            script: som-rs/scripts/hosted_readiness/test_native_ts_host_fragments.py
          - name: original-lifecycle
            script: som-rs/scripts/hosted_readiness/test_typescript_regression_lifecycle.py
          - name: native-checker-targets
            script: som-rs/scripts/hosted_readiness/test_native_ts_checker_targets.py
          - name: original-v3-failures
            script: som-rs/scripts/hosted_readiness/test_typescript_regression_v3_failures.py
          - name: original-v3-replay
            script: som-rs/scripts/hosted_readiness/test_typescript_regression_v3_replay.py
          - name: native-nested-context
            script: som-rs/scripts/hosted_readiness/test_native_ts_nested_context.py
          - name: native-react-input-binder
            script: som-rs/scripts/hosted_readiness/test_native_react_input_binder.py
          - name: native-ts-owner-transport
            script: som-rs/scripts/hosted_readiness/test_native_ts_owner_transport.py
          - name: original-ts-owner
            script: som-rs/scripts/hosted_readiness/test_typescript_regression_owner.py
          - name: original-v2-contract
            script: som-rs/scripts/hosted_readiness/test_typescript_regression_v2_contract.py
          - name: original-common-gate
            script: som-rs/scripts/hosted_readiness/test_run_current_candidate_gate.py
          - name: native-common-services-owner
            script: som-rs/scripts/hosted_readiness/test_native_common_services_owner.py
          - name: original-raw-capture
            script: som-rs/scripts/hosted_readiness/test_typescript_regression_raw_capture.py
          - name: native-mutable-capture
            script: som-rs/scripts/hosted_readiness/test_native_ts_mutable_capture.py
          - name: native-schema-mutable-capture
            script: som-rs/scripts/hosted_readiness/test_native_ts_schema_mutable_capture.py
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Record actual source and interpreter
        run: |
          test "$(git rev-parse HEAD)" = "$HELPER_REVISION"
          git rev-parse HEAD > tested-sha.txt
          python3 --version > python-version.txt 2>&1
      - name: Run the complete selected source fixture file
        env:
          SOURCE_FIXTURE_SCRIPT: ${{ matrix.script }}
        run: |
          sha256sum "$SOURCE_FIXTURE_SCRIPT" > fixture-source-sha256.txt
          python3 -I -S -B "$GITHUB_WORKSPACE/$SOURCE_FIXTURE_SCRIPT" -v 2>&1 | tee source-fixtures.log
      - name: Retain complete output and first failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-active-source-fixtures-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            tested-sha.txt
            python-version.txt
            fixture-source-sha256.txt
            source-fixtures.log
