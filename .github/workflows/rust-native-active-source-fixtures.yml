name: Native active source fixtures
on:
  push:
    branches: [codex/m12-native-shared-semantic-source-fixtures-v1]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  HELPER_REVISION: ${{ github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-fixtures:
    name: source-fixtures (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: public-reconstruction
            script: som-rs/scripts/hosted_readiness/test_reconstruct_public_inputs.py
            legacy: true
          - name: legacy-cnl
            script: som-rs/scripts/hosted_readiness/test_run_experimental_native_cnl.py
            legacy: true
          - name: native-shared-helpers
            script: som-rs/scripts/hosted_readiness/test_native_shared_helper_callers.py
            legacy: false
          - name: native-semantic
            script: som-rs/scripts/hosted_readiness/test_run_candidate_semantic_gates.py
            legacy: false
          - name: native-companions
            script: som-rs/scripts/hosted_readiness/test_run_current_python_companions.py
            legacy: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Record actual source and interpreter
        run: |
          test "$(git rev-parse HEAD)" = "$HELPER_REVISION"
          git rev-parse HEAD > tested-sha.txt
          python3 --version > python-version.txt 2>&1
      - name: Run the complete selected source fixture file
        env:
          SOURCE_FIXTURE_SCRIPT: ${{ matrix.script }}
          LEGACY_FIXTURE: ${{ matrix.legacy }}
        run: |
          sha256sum "$SOURCE_FIXTURE_SCRIPT" > fixture-source-sha256.txt
          if [ "$LEGACY_FIXTURE" = true ]; then
            python3 -I -S -B "$GITHUB_WORKSPACE/.github/actions/native-active-source-fixtures/legacy_runner.py" "$SOURCE_FIXTURE_SCRIPT" 2>&1 | tee source-fixtures.log
          else
            python3 -I -S -B "$GITHUB_WORKSPACE/$SOURCE_FIXTURE_SCRIPT" -v 2>&1 | tee source-fixtures.log
          fi
      - name: Retain complete output and first failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-active-source-fixtures-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            tested-sha.txt
            python-version.txt
            fixture-source-sha256.txt
            source-fixtures.log
