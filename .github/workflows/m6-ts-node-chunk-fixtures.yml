name: M6 TypeScript node transport fixtures
on:
  push:
    branches: [codex/m6-ts-node-chunk-fixtures]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run bounded transport tests
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 -B -m unittest discover -s .github/m6-ts-node-chunk-fixtures -p 'test_*.py' -v
