name: Rust dependency preparation

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      helper_revision:
        description: Exact helper commit selected by the guarded caller
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: rust-dependency-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-helper-fixtures:
    env:
      HELPER_REVISION: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
    name: Dependency helper fixtures (no compiler build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run all dependency and candidate admission fixtures on GitHub
        run: |
          python3 -I -S -B som-rs/scripts/hosted_readiness/test_dependency_candidate.py
          python3 -I -S -B som-rs/scripts/hosted_readiness/product_python/test_qualify_python.py
          python3 -I -S -B som-rs/scripts/hosted_readiness/product_python/test_produce_wheels.py
          python3 -I -S -B som-rs/scripts/hosted_readiness/product_runtime/test_provision_cargo.py
          python3 -I -S -B som-rs/scripts/hosted_readiness/test_run_full_products.py
          python3 -I -S -B som-rs/scripts/hosted_readiness/test_same_candidate_graph.py
          python3 -I -S -B som-rs/scripts/hosted_readiness/test_run_current_python_companions.py
          python3 -I -S -B som-rs/scripts/hosted_readiness/product_runtime/test_runtime_capsule.py

  python-dependency-iteration:
    name: Audited runtime bytes for later GitHub tests (not product readiness)
    needs: dependency-helper-fixtures
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      SOM_DEPENDENCY_ACTIONS_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch the exact recorded candidate source
        run: git fetch --no-tags --depth=1 origin f59e28d910ff4adb16e3becfdc82bd2978ca84fa
      - name: Create the transport control directory and check synthetic fixtures
        working-directory: ${{ runner.temp }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          control="$RUNNER_TEMP/som-runtime-reuse-control"
          mkdir -m 700 "$control"
          mkdir -m 700 "$control/tests"
          printf 'created\n' > "$control/stage.txt"
          cd "$control/tests"
          TMPDIR="$control/tests" python3 -B \
            "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/test_reuse_runtime.py"
          TMPDIR="$control/tests" python3 -I -S -B \
            "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/test_qualify_runtime.py"
      - name: Download the exact controller-audited artifact from its original run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: faberline/som
          run-id: "40740849594"
          artifact-ids: "12840425819"
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/som-runtime-reuse-control/transport
      - name: Restore and recheck all qualified runtime bytes
        working-directory: ${{ runner.temp }}/som-runtime-reuse-control
        env:
          TESTED_SHA: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
          SOM_RUNTIME_ACTIONS_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/reuse_runtime.py" \
            --repo "$GITHUB_WORKSPACE" \
            --source-revision "$TESTED_SHA" \
            --artifact-root "$RUNNER_TEMP/som-runtime-reuse-control/transport" \
            --out "$RUNNER_TEMP/som-product-runtime-qualification"
          cat "$RUNNER_TEMP/som-product-runtime-qualification/github.env" >> "$GITHUB_ENV"
      - name: Preserve reuse receipts and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-runtime-reuse-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/som-runtime-reuse-control/stage.txt
            ${{ runner.temp }}/som-product-runtime-qualification/receipt.json
            ${{ runner.temp }}/som-product-runtime-qualification/artifact-origin.json
            ${{ runner.temp }}/som-product-runtime-qualification/qualification-evidence
            ${{ runner.temp }}/som-product-runtime-qualification/licenses
            ${{ runner.temp }}/som-product-runtime-qualification/logs
            ${{ runner.temp }}/som-product-runtime-qualification/github.env
      - name: Download the exact reviewed compiler and assembly artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: faberline/som
          run-id: "40805208879"
          artifact-ids: "12868189241"
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/som-wheel-assembly-artifact
      - name: Bind the original candidate and every reviewed artifact file
        env:
          HELPER_SHA: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I -S -B som-rs/scripts/hosted_readiness/dependency_candidate.py verify \
            --repo "$GITHUB_WORKSPACE" --helper-revision "$HELPER_SHA" \
            --candidate-revision f59e28d910ff4adb16e3becfdc82bd2978ca84fa \
            --assembly-root "$RUNNER_TEMP/som-wheel-assembly-artifact/_temp/som-unsealed-native-compile"
      - name: Run synthetic wheel and process integrity fixtures on GitHub
        working-directory: ${{ runner.temp }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          mkdir -m 700 "$RUNNER_TEMP/som-wheel-producer-tests"
          TMPDIR="$RUNNER_TEMP/som-wheel-producer-tests" \
            "$SOM_PRODUCT_PYTHON" -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_python/test_produce_wheels.py"
      - name: Read every frozen product environment input
        env:
          TESTED_SHA: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
        run: |
          "$SOM_PRODUCT_PYTHON" -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_python/qualify_python.py" \
            --repo "$GITHUB_WORKSPACE" --source-revision "$TESTED_SHA" \
            --candidate-revision f59e28d910ff4adb16e3becfdc82bd2978ca84fa \
            --assembly "$RUNNER_TEMP/som-wheel-assembly-artifact/_temp/som-unsealed-native-compile" \
            --out "$RUNNER_TEMP/som-wheel-environment-inputs"
      - name: Resolve and stream all named offline environment checks
        env:
          TESTED_SHA: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
        run: |
          "$SOM_PRODUCT_PYTHON" -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_python/produce_wheels.py" \
            --repo "$GITHUB_WORKSPACE" --source-revision "$TESTED_SHA" \
            --candidate-revision f59e28d910ff4adb16e3becfdc82bd2978ca84fa \
            --environments "$RUNNER_TEMP/som-wheel-environment-inputs" \
            --assembly "$RUNNER_TEMP/som-wheel-assembly-artifact/_temp/som-unsealed-native-compile" \
            --runtime "$RUNNER_TEMP/som-product-runtime-qualification" \
            --out "$RUNNER_TEMP/som-python-wheel-qualification"
      - name: Preserve wheel closure, failed environments and all receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-wheel-closure-qualification
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/som-wheel-environment-inputs
            ${{ runner.temp }}/som-python-wheel-qualification/receipt.json
            ${{ runner.temp }}/som-python-wheel-qualification/probe-installed-metadata.py
            ${{ runner.temp }}/som-python-wheel-qualification/logs
            ${{ runner.temp }}/som-python-wheel-qualification/environments
            ${{ runner.temp }}/som-python-wheel-qualification/closures/*/receipt.json
            ${{ runner.temp }}/som-python-wheel-qualification/closures/*/project
            ${{ runner.temp }}/som-python-wheel-qualification/closures/*/requirements.*
            ${{ runner.temp }}/som-python-wheel-qualification/closures/*/publisher-metadata
            ${{ runner.temp }}/som-python-wheel-qualification/closures/*/wheels
            ${{ runner.temp }}/som-python-wheel-qualification/closures/*/wheel-audits
            ${{ runner.temp }}/som-python-wheel-qualification/closures/*/cache-preparation
      - name: Preserve the small wheel failure and completion report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-wheel-qualification-summary
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/som-python-wheel-qualification/receipt.json

  cargo-dependency-iteration:
    name: Complete Rust registry closure (product gates unrun)
    needs: dependency-helper-fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SOM_DEPENDENCY_ACTIONS_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch the exact recorded candidate source
        run: git fetch --no-tags --depth=1 origin f59e28d910ff4adb16e3becfdc82bd2978ca84fa
      - name: Create an owned run and check synthetic integrity fixtures
        working-directory: ${{ runner.temp }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          closure_run="$RUNNER_TEMP/som-cargo-closure-run"
          mkdir -m 700 "$closure_run"
          printf 'created\n' > "$closure_run/stage.txt"
          mkdir -m 700 "$closure_run/tests"
          cd "$closure_run/tests"
          TMPDIR="$closure_run/tests" python3 -B \
            "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/test_provision_cargo.py"
      - name: Download this run's compile and assembly evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: faberline/som
          run-id: "40805208879"
          artifact-ids: "12868189241"
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/som-cargo-closure-run/input
      - name: Bind the original candidate and every reviewed artifact file
        env:
          HELPER_SHA: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I -S -B som-rs/scripts/hosted_readiness/dependency_candidate.py verify \
            --repo "$GITHUB_WORKSPACE" --helper-revision "$HELPER_SHA" \
            --candidate-revision f59e28d910ff4adb16e3becfdc82bd2978ca84fa \
            --assembly-root "$RUNNER_TEMP/som-cargo-closure-run/input/_temp/som-unsealed-native-compile"
      - name: Check the required real product consumer route
        working-directory: ${{ runner.temp }}/som-cargo-closure-run
        env:
          TESTED_SHA: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B - "$PWD" "$TESTED_SHA" <<'PY'
          import json, pathlib, sys
          run = pathlib.Path(sys.argv[1])
          root = run / "input/_temp/som-unsealed-native-compile"
          manifest = json.loads((root / "assembly/manifest.json").read_text())
          if manifest["tested_sha"] != "f59e28d910ff4adb16e3becfdc82bd2978ca84fa":
              raise SystemExit("assembly artifact is not this candidate")
          products = manifest["products"]["rust"]
          references = {}
          for phase, identity in (("phase1", "example-v1"), ("phase2", "services14-0000")):
              rows = [row for row in products if (row["phase"], row["id"]) == (phase, identity)]
              if len(rows) != 1:
                  raise SystemExit("named real Cargo reference is missing")
              path = root / rows[0]["product_dir"]
              if not all((path / leaf).is_file() for leaf in ("src/main.rs", "Cargo.toml", "Cargo.lock")):
                  raise SystemExit("real generated Cargo reference target is missing")
              references[phase] = str(path)
          (run / "consumer-roots.json").write_text(json.dumps({"assembly_root": str(root), **references}))
          PY
      - name: Install exact Rust tools inside the owned run
        working-directory: ${{ runner.temp }}/som-cargo-closure-run
        run: |
          RUSTUP_HOME="$PWD/rustup" CARGO_HOME="$PWD/bootstrap-cargo" \
            rustup toolchain install 1.96.1 --profile minimal > rustup-install.log 2>&1
      - name: Make and verify all 352 registry packages
        working-directory: ${{ runner.temp }}/som-cargo-closure-run
        env:
          TESTED_SHA: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cargo_tool="$(RUSTUP_HOME="$PWD/rustup" CARGO_HOME="$PWD/bootstrap-cargo" rustup which --toolchain 1.96.1 cargo)"
          rustc_tool="$(RUSTUP_HOME="$PWD/rustup" CARGO_HOME="$PWD/bootstrap-cargo" rustup which --toolchain 1.96.1 rustc)"
          python3 -B - "$GITHUB_WORKSPACE" "$PWD" "$TESTED_SHA" "$cargo_tool" "$rustc_tool" <<'PY'
          import json, pathlib, subprocess, sys
          repo, run = map(pathlib.Path, sys.argv[1:3])
          refs = json.loads((run / "consumer-roots.json").read_text())
          subprocess.run([sys.executable, "-B", str(repo / "som-rs/scripts/hosted_readiness/product_runtime/provision_cargo.py"),
                          "--repo", str(repo), "--source-revision", sys.argv[3],
                          "--candidate-revision", "f59e28d910ff4adb16e3becfdc82bd2978ca84fa", "--out", str(run / "closure"),
                          "--cargo", sys.argv[4], "--rustc", sys.argv[5], "--assembly-root", refs["assembly_root"],
                          "--phase1-product-root", refs["phase1"], "--phase2-product-root", refs["phase2"]],
                         cwd=run, check=True)
          PY
      - name: Preserve registry closure candidate and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-cargo-closure-candidate
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/som-cargo-closure-run/stage.txt
            ${{ runner.temp }}/som-cargo-closure-run/consumer-roots.json
            ${{ runner.temp }}/som-cargo-closure-run/rustup-install.log
            ${{ runner.temp }}/som-cargo-closure-run/closure

  product-rust-tool-qualification:
    needs: dependency-helper-fixtures
    name: Complete Rust product tools (product gates unrun)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check synthetic source, archive and process fixtures on GitHub
        working-directory: ${{ runner.temp }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          test_root="$RUNNER_TEMP/som-rust-product-tool-tests"
          mkdir -m 700 "$test_root"
          TMPDIR="$test_root" python3 -I -S -B \
            "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/test_qualify_rust_tools.py" \
            2>&1 | tee "$test_root/fixtures.log"
      - name: Qualify all six tools and the complete official runtime tree
        working-directory: ${{ runner.temp }}
        env:
          TESTED_SHA: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/qualify_rust_tools.py" \
            --repo "$GITHUB_WORKSPACE" --source-revision "$TESTED_SHA" \
            --out "$RUNNER_TEMP/som-rust-product-tools-qualification"
      - name: Keep complete qualification and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-rust-tool-qualification
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/som-rust-product-tool-tests/fixtures.log
            ${{ runner.temp }}/som-rust-product-tools-qualification

  recorded-candidate-carrier:
    name: Recover only byte-identical recorded f59 compiler files
    needs: dependency-helper-fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      RUSTUP_TOOLCHAIN: 1.96.1
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      RUST_BACKTRACE: 1
      PYTHONDONTWRITEBYTECODE: "1"
      SOM_DEPENDENCY_ACTIONS_TOKEN: ${{ github.token }}
      HELPER_REVISION: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch the exact original compiler source as metadata
        run: git fetch --no-tags --depth=1 origin f59e28d910ff4adb16e3becfdc82bd2978ca84fa
      - name: Create the narrow raw Git source launcher
        run: |
          umask 077
          set -o noclobber
          cat > "$RUNNER_TEMP/som-carrier-bound-source.py" <<'PY'
          import os, pathlib, re, stat, subprocess, sys, types
          repo, revision, name = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          assert repo.is_absolute() and re.fullmatch('[0-9a-f]{40}', revision)
          assert name in {'som-rs/scripts/hosted_readiness/dependency_candidate.py',
                          'som-rs/scripts/hosted_readiness/provision_native.py',
                          'som-rs/scripts/hosted_readiness/product_runtime/candidate_carrier.py'}
          def git(*args):
              return subprocess.check_output(['/usr/bin/git', '--no-replace-objects', '-C', str(repo), *args],
                                             stderr=subprocess.DEVNULL)
          assert git('rev-parse', '--verify', 'HEAD^{commit}').decode().strip() == revision
          entry = git('ls-tree', '-z', revision, '--', name)
          assert entry.count(b'\0') == 1 and entry.endswith(b'\t' + name.encode() + b'\0')
          assert entry.startswith((b'100644 blob ', b'100755 blob '))
          path = repo / name
          assert not any(part.is_symlink() for part in (path, *path.parents))
          with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK), 'rb') as stream:
              info = os.fstat(stream.fileno())
              assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= 2**20
              body = stream.read(2**20 + 1)
          assert len(body) <= 2**20 and body == git('cat-file', 'blob', revision + ':' + name)
          module = types.ModuleType('__main__')
          module.__file__, module.__package__, module.__cached__ = str(path), '', None
          sys.modules['__main__'], sys.argv = module, [str(path), *sys.argv[4:]]
          exec(compile(body, str(path), 'exec', dont_inherit=True), module.__dict__)
          PY
      - name: Restore the complete recorded compiler and assembly proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: faberline/som
          run-id: "40805208879"
          artifact-ids: "12868189241"
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/som-carrier-assembly-proof
      - name: Require all original compiler inputs before building
        env:
          HELPER_REVISION: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I -S -B "$RUNNER_TEMP/som-carrier-bound-source.py" \
            "$GITHUB_WORKSPACE" "$HELPER_REVISION" \
            som-rs/scripts/hosted_readiness/dependency_candidate.py verify \
            --repo "$GITHUB_WORKSPACE" --helper-revision "$HELPER_REVISION" \
            --candidate-revision f59e28d910ff4adb16e3becfdc82bd2978ca84fa \
            --assembly-root "$RUNNER_TEMP/som-carrier-assembly-proof/_temp/som-unsealed-native-compile"
          printf 'CARGO_TARGET_DIR=%s/som-experimental-cargo-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install the original native compiler toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt 2>&1 | tee carrier-tools.log
          rustc -vV | tee -a carrier-tools.log
          cargo -vV | tee -a carrier-tools.log
          rustfmt --version | tee -a carrier-tools.log
          sha256sum "$(rustup which rustc)" "$(rustup which cargo)" "$(rustup which rustfmt)" | tee -a carrier-tools.log
      - name: Fetch only the original locked compiler dependencies
        run: |
          cargo fetch --locked --manifest-path som-rs/Cargo.toml 2>&1 | tee carrier-fetch.log
          cargo fetch --locked --manifest-path som-rs/som-targets/Cargo.toml 2>&1 | tee -a carrier-fetch.log
      - name: Provision the original verified native formatters
        run: |
          python3 -I -S -B "$RUNNER_TEMP/som-carrier-bound-source.py" \
            "$GITHUB_WORKSPACE" "$HELPER_REVISION" \
            som-rs/scripts/hosted_readiness/provision_native.py \
            --manifest som-rs/contracts/native-tools-v1/artifacts.json \
            --out "$RUNNER_TEMP/som-native-tools" \
            --rustfmt "$(rustup which rustfmt)" 2>&1 | tee carrier-native.log
          cat "$RUNNER_TEMP/som-native-tools/github.env" >> "$GITHUB_ENV"
      - name: Recreate the original compiler asset files
        run: |
          cargo run --locked --offline --manifest-path som-rs/Cargo.toml \
            --bin som-compiler-assets -- \
            --destination som-rs/compiler-assets/current \
            --formatter "$SOM_RUFF" 2>&1 | tee carrier-assets.log
      - name: Build once and record the actual new binary hash
        run: |
          cargo build --locked --offline --manifest-path som-rs/som-targets/Cargo.toml --bin som 2>&1 | tee carrier-build.log
          sha256sum "$CARGO_TARGET_DIR/debug/som" | tee -a carrier-build.log
      - name: Copy the exact built inputs into an owned single-link staging directory
        run: |
          python3 -I -S -B - "$CARGO_TARGET_DIR/debug/som" "$SOM_RUSTFMT" "$RUNNER_TEMP" <<'PY'
          import hashlib, json, os, pathlib, stat, sys
          temporary = pathlib.Path(sys.argv[3])
          root = temporary / 'som-carrier-regular-inputs'
          assert temporary.is_absolute() and not any(p.is_symlink() for p in (root, *root.parents))
          root.mkdir(mode=0o700)
          proof = json.loads((temporary / 'som-carrier-assembly-proof/_temp/som-unsealed-native-compile/manifest.json').read_bytes())
          expected = {'binary': proof['initial_identities']['binary'],
                      'rustfmt': proof['initial_identities']['tools']['SOM_RUSTFMT']}
          record = {'version': 'som.carrier-single-link-staging.v1', 'files': {}, 'product_acceptance_passed': False}
          fields = ('st_dev', 'st_ino', 'st_nlink', 'st_mode', 'st_size', 'st_mtime_ns', 'st_ctime_ns')
          for name, argument in zip(('binary', 'rustfmt'), sys.argv[1:3]):
              source = pathlib.Path(argument)
              assert source.is_absolute() and not any(p.is_symlink() for p in (source, *source.parents))
              with os.fdopen(os.open(source, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK), 'rb') as stream:
                  before = os.fstat(stream.fileno())
                  assert stat.S_ISREG(before.st_mode) and 0 < before.st_nlink and before.st_size <= 300 * 1024**2
                  body = stream.read(300 * 1024**2 + 1)
                  identity = {'sha256': hashlib.sha256(body).hexdigest(), 'size': len(body), 'mode': stat.S_IMODE(before.st_mode)}
                  print(json.dumps({'source': str(source), 'nlink': before.st_nlink, **identity}), flush=True)
                  assert identity == {key: expected[name][key] for key in identity}
                  destination = root / name
                  with destination.open('xb') as output:
                      output.write(body)
                      os.fchmod(output.fileno(), identity['mode'])
                      output.flush()
                      os.fsync(output.fileno())
                  after = os.fstat(stream.fileno())
                  assert all(getattr(before, key) == getattr(after, key) for key in fields)
                  assert all(getattr(after, key) == getattr(source.lstat(), key) for key in fields)
                  stream.seek(0)
                  assert stream.read(300 * 1024**2 + 1) == body
              installed = destination.stat()
              assert stat.S_ISREG(installed.st_mode) and installed.st_nlink == 1
              assert installed.st_size == identity['size'] and stat.S_IMODE(installed.st_mode) == identity['mode']
              assert hashlib.sha256(destination.read_bytes()).hexdigest() == identity['sha256']
              record['files'][name] = {'source': str(source), 'source_nlink': before.st_nlink,
                                      'staged': str(destination), 'staged_nlink': installed.st_nlink, **identity}
          (root / 'receipt.json').write_text(json.dumps(record, sort_keys=True) + '\n')
          PY
      - name: Recheck source and require exact recorded binary, assets and tools
        env:
          HELPER_REVISION: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I -S -B "$RUNNER_TEMP/som-carrier-bound-source.py" \
            "$GITHUB_WORKSPACE" "$HELPER_REVISION" \
            som-rs/scripts/hosted_readiness/dependency_candidate.py verify \
            --repo "$GITHUB_WORKSPACE" --helper-revision "$HELPER_REVISION" \
            --candidate-revision f59e28d910ff4adb16e3becfdc82bd2978ca84fa \
            --assembly-root "$RUNNER_TEMP/som-carrier-assembly-proof/_temp/som-unsealed-native-compile"
          python3 -I -S -B "$RUNNER_TEMP/som-carrier-bound-source.py" \
            "$GITHUB_WORKSPACE" "$HELPER_REVISION" \
            som-rs/scripts/hosted_readiness/product_runtime/candidate_carrier.py \
            --byte-identical-rebuild \
            --candidate-revision f59e28d910ff4adb16e3becfdc82bd2978ca84fa \
            --compile-manifest "$RUNNER_TEMP/som-carrier-assembly-proof/_temp/som-unsealed-native-compile/manifest.json" \
            --binary "$RUNNER_TEMP/som-carrier-regular-inputs/binary" \
            --assets "$GITHUB_WORKSPACE/som-rs/compiler-assets/current" \
            --native "$RUNNER_TEMP/som-native-tools" --rustfmt "$RUNNER_TEMP/som-carrier-regular-inputs/rustfmt" \
            --out "$RUNNER_TEMP/som-tested-candidate-carrier"
      - name: Verify unchanged dependency locks
        if: always()
        run: git diff --exit-code -- som-rs/Cargo.lock som-rs/som-targets/Cargo.lock
      - name: Preserve the exact recovered carrier and all build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recorded-f59-candidate-carrier
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            carrier-tools.log
            carrier-fetch.log
            carrier-native.log
            carrier-assets.log
            carrier-build.log
            ${{ runner.temp }}/som-carrier-regular-inputs/receipt.json
            ${{ runner.temp }}/som-tested-candidate-carrier

  product-cohort-plan:
    needs: dependency-helper-fixtures
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      HELPER_REVISION: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Load the one complete product cohort plan
        id: plan
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/same_candidate_graph.py -- matrix

  full-product-preparation:
    name: Fresh product gates (${{ matrix.stage }} ${{ matrix.index }}/${{ matrix.count }})
    needs: [python-dependency-iteration, cargo-dependency-iteration, product-rust-tool-qualification, product-cohort-plan]
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.product-cohort-plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CANDIDATE_REVISION: f59e28d910ff4adb16e3becfdc82bd2978ca84fa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch the exact recorded candidate source
        run: git fetch --no-tags --depth=1 origin f59e28d910ff4adb16e3becfdc82bd2978ca84fa
      - name: Download the fixed independently audited runtime transport
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: faberline/som
          run-id: "40740849594"
          artifact-ids: "12840425819"
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/som-full-runtime-transport
      - name: Restore all native runtime bytes at the admitted prefix
        env:
          HELPER_REVISION: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
          SOM_RUNTIME_ACTIONS_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/reuse_runtime.py" \
            --repo "$GITHUB_WORKSPACE" --source-revision "$HELPER_REVISION" \
            --artifact-root "$RUNNER_TEMP/som-full-runtime-transport" \
            --out "$RUNNER_TEMP/som-product-runtime-qualification"
          cat "$RUNNER_TEMP/som-product-runtime-qualification/github.env" >> "$GITHUB_ENV"
      - name: Qualify the exact complete six-tool Rust product profile
        env:
          HELPER_REVISION: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
        working-directory: ${{ runner.temp }}
        run: |
          python3 -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/qualify_rust_tools.py" \
            --repo "$GITHUB_WORKSPACE" --source-revision "$HELPER_REVISION" \
            --out "$RUNNER_TEMP/som-rust-product-tools-qualification"
      - name: Download the fixed complete f59 compile and assembly artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: faberline/som
          run-id: "40805208879"
          artifact-ids: "12868189241"
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/som-full-assembly-transport
      - name: Download the current helper wheel closure qualification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-wheel-closure-qualification
          path: ${{ runner.temp }}/som-full-wheel-transport
      - name: Download the current helper complete Cargo closure
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-cargo-closure-candidate
          path: ${{ runner.temp }}/som-full-cargo-transport
      - name: Run every named slot of this shard with fresh product commands
        env:
          HELPER_REVISION: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
          SOM_DEPENDENCY_ACTIONS_TOKEN: ${{ github.token }}
          PRODUCT_STAGE: ${{ matrix.stage }}
          SHARD_INDEX: ${{ matrix.index }}
          SHARD_COUNT: ${{ matrix.count }}
        working-directory: ${{ runner.temp }}
        run: |
          # Keep the original M3 fixture socket location on this disposable runner.
          sudo install -d -m 1777 /private/tmp
          "$SOM_PRODUCT_PYTHON" -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/run_full_products.py" \
            --mode experimental-preparation --stage "$PRODUCT_STAGE" \
            --repo "$GITHUB_WORKSPACE" --helper-revision "$HELPER_REVISION" \
            --candidate-revision "$CANDIDATE_REVISION" \
            --assembly-root "$RUNNER_TEMP/som-full-assembly-transport/_temp/som-unsealed-native-compile" \
            --wheel-root "$RUNNER_TEMP/som-full-wheel-transport/som-python-wheel-qualification" \
            --cargo-root "$RUNNER_TEMP/som-full-cargo-transport/closure" \
            --runtime-root "$RUNNER_TEMP/som-product-runtime-qualification" \
            --rust-tools-root "$RUNNER_TEMP/som-rust-product-tools-qualification" \
            --shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT" \
            --out "$RUNNER_TEMP/som-full-product-run"
      - name: Preserve all product rows, full command logs and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-product-${{ matrix.stage }}-${{ matrix.index }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/som-full-product-run
            ${{ runner.temp }}/som-rust-product-tools-qualification/receipt.json
            ${{ runner.temp }}/som-rust-product-tools-qualification/logs
            ${{ runner.temp }}/som-product-runtime-qualification/receipt.json

  full-product-preparation-join:
    name: Join every required named product slot (preparation only)
    env:
      HELPER_REVISION: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
    needs: full-product-preparation
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.helper_revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: full-product-*
          path: ${{ runner.temp }}/som-full-product-shards
      - name: Require complete ordered disjoint cohorts and identical artifact identities
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/same_candidate_graph.py -- receipt-paths --root "$RUNNER_TEMP/som-full-product-shards" > "$RUNNER_TEMP/som-full-product-receipts.list"
          mapfile -d '' receipts < "$RUNNER_TEMP/som-full-product-receipts.list"
          python3 -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/run_full_products.py" \
            --join --out "$RUNNER_TEMP/som-full-product-join.json" "${receipts[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-product-preparation-join
          path: ${{ runner.temp }}/som-full-product-join.json
          if-no-files-found: error
