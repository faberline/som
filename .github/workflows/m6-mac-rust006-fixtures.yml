name: Test Mac Rust006 raw recorder fixtures
on:
  push:
    branches:
      - codex/m6-mac-rust006-fixtures-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run focused raw and wait fixtures
        run: python3 -B som-rs/scripts/react_output_acceptance/test_mac_rust006_extra.py
