name: Native source admission and complete evidence fixture checks

on:
  push:
    branches:
      - codex/m12-native-source-fixtures
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: som-native-source-fixtures-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'
  HELPER_REVISION: ${{ github.sha }}

jobs:
  readiness-source-fixtures:
    name: Run all existing and new readiness source fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record the exact source and Python version
        run: |
          test "$(git rev-parse HEAD)" = "$HELPER_REVISION"
          printf '%s\n' "$HELPER_REVISION" > tested-sha.txt
          python3 --version 2>&1 | tee python-version.log
      - name: Run the complete source fixture inventory on GitHub
        run: |
          python3 -I -S -B - <<'PY' 2>&1 | tee readiness-source-fixtures.log
          import ast
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'som-rs/scripts/hosted_readiness'
          files = sorted(root.glob('test_*.py'))
          assert files, 'complete source fixture inventory must not be empty'
          rows = []
          for path in files:
              tree = ast.parse(path.read_bytes())
              main = ast.dump(ast.parse("__name__ == '__main__'", mode='eval').body)
              assert any(isinstance(node, ast.If) and ast.dump(node.test) == main for node in tree.body), path
              argv = [sys.executable, '-I', '-S', '-B', str(path), '-v']
              print('BEGIN SOURCE FIXTURE FILE ' + path.name, flush=True)
              started = time.monotonic()
              child = subprocess.run(argv, check=False)
              rows.append({'path': path.name, 'argv': argv, 'wait_completed': True,
                           'exit_code': child.returncode, 'elapsed_seconds': time.monotonic() - started})
              print('END SOURCE FIXTURE FILE ' + path.name + ' exit=' + str(child.returncode), flush=True)
          Path('source-fixture-results.json').write_text(json.dumps({'files': rows,
              'complete_inventory': [path.name for path in files],
              'all_files_ran': len(rows) == len(files),
              'product_acceptance_passed': False}, indent=2) + '\n')
          raise SystemExit(1 if any(row['exit_code'] for row in rows) else 0)
          PY
      - name: Preserve all fixture output including first failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-readiness-source-fixtures
          if-no-files-found: error
          retention-days: 30
          path: |
            tested-sha.txt
            python-version.log
            readiness-source-fixtures.log
            source-fixture-results.json

  current-context-source-fixtures:
    name: Run all current input role and retained process proof fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record the exact source and Python version
        run: |
          test "$(git rev-parse HEAD)" = "$HELPER_REVISION"
          printf '%s\n' "$HELPER_REVISION" > tested-sha.txt
          python3 --version 2>&1 | tee python-version.log
      - name: Run all 34 current input source fixtures on GitHub
        run: |
          python3 -I -S -B \
            "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/test_current_input_context.py" \
            -v 2>&1 | tee current-context-fixtures.log
      - name: Preserve all fixture output including first failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-current-context-source-fixtures
          if-no-files-found: error
          retention-days: 30
          path: |
            tested-sha.txt
            python-version.log
            current-context-fixtures.log
