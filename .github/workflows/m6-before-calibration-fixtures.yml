name: M6 recorded before calibration fixtures
on:
  push:
    branches: [codex/m6-before-calibration-fixture]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run synthetic fixtures
        run: python3 som-rs/scripts/react_output_acceptance/issue131/test_calibrate.py
