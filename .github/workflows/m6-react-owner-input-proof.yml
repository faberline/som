name: M6 two-source historical input proof
on:
  push:
    branches: [codex/m6-react-owner-input-proof-20261029]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  proof:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify proof source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Fetch the approved 18-package inputs and original manifest revision
        run: |
          git fetch --no-tags --depth=1 origin 1de8f05430a72f8d76f6159786cca71b0ae1a911 55eb7f5c3b21d4f3b57eb721ab60c6aa97e10db3
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);current='1de8f05430a72f8d76f6159786cca71b0ae1a911';old='55eb7f5c3b21d4f3b57eb721ab60c6aa97e10db3'
          def blob(commit,name):return subprocess.check_output(['git','show',commit+':'+name])
          raw=blob(current,'inputs-index.json');old_raw=blob(old,'inputs-index.json')
          if hashlib.sha256(raw).hexdigest()!='c468ae2086e4d64847b93ad8da08aa3828f30989008db470519cd408e55b67bf' or hashlib.sha256(old_raw).hexdigest()!='78375feb14ed286ac5df4c52f13d5d1ae301b2057d5e3894edf0f36c2705c498':raise SystemExit('input index refused')
          (temp/'m6-final-input-config.json').write_text(json.dumps({'version':'som.m6-hosted-inputs.v1','commit':current,'index_sha256':hashlib.sha256(raw).hexdigest()})+'\n')
          destination=temp/'input-packages';destination.mkdir(mode=0o700);(destination/'inputs-index.json').write_bytes(old_raw)
          for item in json.loads(old_raw)['packages']:
              name=item['manifest']
              if not re.fullmatch(r'package-[0-9]{3}[.]manifest[.]json',name):raise SystemExit('manifest name refused')
              data=blob(old,name)
              if hashlib.sha256(data).hexdigest()!=item['manifest_sha256']:raise SystemExit('manifest refused')
              (destination/name).write_bytes(data)
          PY
      - name: Restore approved 18 packages
        env:
          M6_INPUTS_KEYRING: ${{ secrets.SOM_M6_ACCEPTANCE_INPUTS_V2 }}
        run: |
          python3 som-rs/scripts/react_output_acceptance/fetch_hosted_inputs.py --repo-root "$GITHUB_WORKSPACE" --config "$RUNNER_TEMP/m6-final-input-config.json" --out "$RUNNER_TEMP/approved-inputs" --node node
      - name: Independently verify the approved supplement
        run: python3 som-rs/scripts/react_output_acceptance/audit_supplement_provision.py
      - name: Download and verify approved encrypted evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/faberline/som/actions/artifacts/12843589912 > "$RUNNER_TEMP/metadata.json"
          gh api repos/faberline/som/actions/artifacts/12843589912/zip > "$RUNNER_TEMP/evidence.zip"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat, zipfile
          temp=pathlib.Path(os.environ['RUNNER_TEMP']); meta=json.loads((temp/'metadata.json').read_bytes()); run=meta.get('workflow_run',{})
          if (meta.get('id'),meta.get('name'),meta.get('size_in_bytes'),meta.get('digest'),meta.get('expired')) != (12843589912,'m6-sealed-raw-evidence',249935784,'sha256:33fbad9d63cfa257636384b9b7c10e1406f2306922e4f28e8189c79f703b041e',False): raise SystemExit('artifact metadata refused')
          if (run.get('id'),run.get('head_sha'),run.get('repository_id')) != (40743738705,'40cffc13b3bff35e3ea5804b9f43a49cdef7b3c0',1390374878): raise SystemExit('artifact origin refused')
          archive=temp/'evidence.zip'
          with archive.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
          if archive.stat().st_size != 249935784 or digest != '33fbad9d63cfa257636384b9b7c10e1406f2306922e4f28e8189c79f703b041e': raise SystemExit('artifact bytes refused')
          dest=temp/'evidence-sealed'; dest.mkdir(mode=0o700)
          with zipfile.ZipFile(archive) as z:
              members=z.infolist(); names=[m.filename for m in members]
              expected={'evidence-index.json'} | {f'package-{i:03d}.{s}' for i in range(23) for s in ('sealed','manifest.json')}
              if len(set(names))!=len(names) or set(names)!=expected or sum(m.file_size for m in members)>512*1024*1024: raise SystemExit('artifact members refused')
              for m in members:
                  if stat.S_IFMT(m.external_attr>>16) not in (0,stat.S_IFREG) or not 0<=m.file_size<=128*1024*1024: raise SystemExit('artifact member refused')
                  with z.open(m) as source, (dest/m.filename).open('xb') as target:
                      count=0
                      while chunk:=source.read(1024*1024):
                          count+=len(chunk)
                          if count>m.file_size: raise SystemExit('artifact length refused')
                          target.write(chunk)
                      if count!=m.file_size: raise SystemExit('artifact length refused')
          if hashlib.sha256((dest/'evidence-index.json').read_bytes()).hexdigest()!='3759239392208eab81bf740ca9ca2a41465be3e3e4995de2bd255774f4596bea': raise SystemExit('evidence index refused')
          PY
      - name: Restore the approved later capture in runner scratch
        env:
          M6_INPUTS_KEYRING: ${{ secrets.SOM_M6_ACCEPTANCE_INPUTS_V2 }}
        run: |
          node som-rs/scripts/react_output_acceptance/restore_hosted_evidence.mjs --root "$RUNNER_TEMP/evidence-sealed" --out "$RUNNER_TEMP/evidence" --index-sha256 3759239392208eab81bf740ca9ca2a41465be3e3e4995de2bd255774f4596bea > /dev/null
      - name: Verify and install the 668 derived pairs
        run: |
          scripts=som-rs/scripts/react_output_acceptance
          map="$scripts/historical-response-reuse-map.json"
          python3 "$scripts/reconstruct_historical_responses.py" --map "$map" --input-packages "$RUNNER_TEMP/input-packages" --input-root "$RUNNER_TEMP/approved-inputs" --evidence-packages "$RUNNER_TEMP/evidence-sealed" --evidence-root "$RUNNER_TEMP/evidence" --out "$RUNNER_TEMP/m6-derived"
          python3 "$scripts/verify_historical_response_provenance.py" --map "$map" --evidence-packages "$RUNNER_TEMP/evidence-sealed" --evidence-root "$RUNNER_TEMP/evidence"
          python3 "$scripts/install_derived_inputs.py" --map "$map" --inputs "$RUNNER_TEMP/approved-inputs" --derived "$RUNNER_TEMP/m6-derived"
          test ! -e .local
          test ! -L .local
          mv "$RUNNER_TEMP/approved-inputs/.local" .local
          chmod -R a-w .local/react-output/npm-cache-001 .local/typescript-output/npm-cache-001
      - name: Independently bind both historic input roles
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys
          repo=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          sys.path.insert(0,str(repo/'som-rs/scripts/react_output_acceptance/audit'))
          import audit_mac_rust006_extra as audit
          public=repo/'.local/rust-compiler-goal/acceptance/public-products-003b'
          legacy=repo/'.local/rust-compiler-goal/acceptance/legacy544/run-005'
          temp=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          inputs=audit.approved_inputs(public,legacy,temp/'m6-final-input-config.json',temp)
          derived=[name for name,row in inputs.files.items() if row.get('source')=='later-capture-derived']
          if len(derived)!=1336:raise SystemExit('derived source count refused')
          print(json.dumps({'status':'passed','approved_index_sha256':audit.HISTORIC_RESPONSE_APPROVED_INDEX_SHA256,
              'later_capture_derived_files':len(derived),'product_acceptance':'not_run'},sort_keys=True))
          PY
      - name: Verify extracted source-bound owner input binding
        run: |
          python3 -I -S -B - <<'PY'
          import json,os,pathlib,subprocess,sys
          repo=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          revision=os.environ['GITHUB_SHA']
          def source(name):
              raw=subprocess.check_output(['git','--no-replace-objects','-C',str(repo),'show',revision+':'+name])
              if (repo/name).read_bytes()!=raw:raise SystemExit('source bytes differ')
              return raw
          name='som-rs/scripts/react_output_acceptance/m6_react_callback.py'
          raw=source(name)
          from types import ModuleType
          mod=ModuleType('_som_react_owner_test');mod.__file__=str(repo/name);mod.__package__=''
          sys.modules[mod.__name__]=mod
          exec(compile(raw,mod.__file__,'exec',dont_inherit=True),mod.__dict__)
          approved=mod.approved_manifest(repo)
          original=mod.approved_manifest(repo,mod.ORIGINAL_INPUT_COMMIT,mod.ORIGINAL_INPUT_INDEX_SHA,16)
          with mod.source_bound_derived_inputs(source,repo) as bound:
              derived=[name for name,row in bound.files.items() if row.get('source')=='later-capture-derived']
              if len(approved)!=8377 or len(derived)!=1336:raise SystemExit('input roles differ')
              for name in derived:
                  if name not in original or mod.sha(bound.read(repo/name))!=original[name]['sha256']:
                      raise SystemExit('derived source binding differs')
          print(json.dumps({'approved_files':len(approved),'derived_files':len(derived),
                            'runtime_comparison':'unrun','product_acceptance':'not_run'},sort_keys=True))
          PY
