name: M6 React 39-pin Python QA closure (not product acceptance)
on:
  push:
    branches:
      - codex/m6-react-python-qualification-20261029
permissions:
  contents: read
  actions: read
jobs:
  qualification:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind reviewed qualification source
        working-directory: .github/m6-react-python-closure
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sha256sum qualify_react_python.py | cut -d ' ' -f 1)" = c83660e629f743a759a8c9511345e9ed1568bd153f667fd2605956e006c26cdb
          test "$(git show "$GITHUB_SHA:.github/m6-react-python-closure/qualify_react_python.py" | sha256sum | cut -d ' ' -f 1)" = c83660e629f743a759a8c9511345e9ed1568bd153f667fd2605956e006c26cdb
          for entry in \
            'som-rs/scripts/hosted_readiness/product_runtime/reuse_runtime.py 2a92e2df47fb05e76677fbb84e9cbb7f12d07d90eb8019bd816b5fe6b5588598' \
            'som-rs/scripts/hosted_readiness/product_runtime/qualify_runtime.py f3c6f69e922ab0a8f27426a5f597c03f213d40be0fb7fc324ac33f1b48ae66f3' \
            'som-rs/scripts/hosted_readiness/product_runtime/runtime-bf3-qualification.json 4aaca5ef284440fd64bd50723619425201417937b4d635bb3c5d2d5835226b68' \
            'som-rs/scripts/hosted_readiness/product_runtime/runtime-bf3-byte-audit.json 7a2c04a65866474bd773b9722274c09c36646951fa7848d62e4b20b2cb94e75f' \
            'som-rs/scripts/hosted_readiness/product_runtime/source-pins.json a4208c342bc9e923509bc5ba7ce6a9a1adfe3143d55b6215f0a313b4833550b2'; do
            set -- $entry
            test "$(sha256sum "$GITHUB_WORKSPACE/$1" | cut -d ' ' -f 1)" = "$2"
            test "$(git show "$GITHUB_SHA:$1" | sha256sum | cut -d ' ' -f 1)" = "$2"
          done
      - name: Create runtime transport directory
        working-directory: ${{ runner.temp }}
        run: mkdir -m 700 "$RUNNER_TEMP/som-runtime-reuse-control"
      - name: Download the source-qualified runtime artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: faberline/som
          run-id: '40740849594'
          artifact-ids: '12840425819'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/som-runtime-reuse-control/transport
      - name: Restore and verify runtime
        working-directory: ${{ runner.temp }}/som-runtime-reuse-control
        env:
          SOM_RUNTIME_ACTIONS_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/reuse_runtime.py" --repo "$GITHUB_WORKSPACE" --source-revision "$GITHUB_SHA" --artifact-root "$RUNNER_TEMP/som-runtime-reuse-control/transport" --out "$RUNNER_TEMP/som-product-runtime-qualification"
      - name: Qualify separate React QA wheel closure
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/som-product-runtime-qualification/install/python/bin/python3.12" -I -S -B "$GITHUB_WORKSPACE/.github/m6-react-python-closure/qualify_react_python.py" --repo "$GITHUB_WORKSPACE" --source-revision "$GITHUB_SHA" --runtime "$RUNNER_TEMP/som-product-runtime-qualification" --out "$RUNNER_TEMP/som-react-python-closure"
      - name: Package qualification and failure evidence with file modes
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          paths=()
          for path in som-react-python-closure som-product-runtime-qualification/receipt.json som-product-runtime-qualification/artifact-origin.json som-product-runtime-qualification/qualification-evidence som-product-runtime-qualification/licenses som-product-runtime-qualification/logs; do
            if [ -e "$path" ]; then paths+=("$path"); fi
          done
          if [ "${#paths[@]}" -gt 0 ]; then
            tar -cf "$RUNNER_TEMP/react-python-qa-closure.tar" "${paths[@]}"
            sha256sum "$RUNNER_TEMP/react-python-qa-closure.tar" > "$RUNNER_TEMP/react-python-qa-closure.tar.sha256"
          fi
      - name: Preserve qualification and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: react-python-qa-closure
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/react-python-qa-closure.tar
            ${{ runner.temp }}/react-python-qa-closure.tar.sha256
