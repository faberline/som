name: M6 React Python closure synthetic fixtures (not acceptance)
on:
  push:
    branches:
      - codex/m6-react-python-closure-v2-20261029
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind reviewed source before execution
        working-directory: .github/m6-react-python-closure
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sha256sum qualify_react_python.py | cut -d ' ' -f 1)" = c83660e629f743a759a8c9511345e9ed1568bd153f667fd2605956e006c26cdb
          test "$(git show "$GITHUB_SHA:.github/m6-react-python-closure/qualify_react_python.py" | sha256sum | cut -d ' ' -f 1)" = c83660e629f743a759a8c9511345e9ed1568bd153f667fd2605956e006c26cdb
          test "$(sha256sum test_qualify_react_python.py | cut -d ' ' -f 1)" = c9b4dab87386a5972b85e3abbe98219a650906f377d473b19f58e10b8464ea53
          test "$(git show "$GITHUB_SHA:.github/m6-react-python-closure/test_qualify_react_python.py" | sha256sum | cut -d ' ' -f 1)" = c9b4dab87386a5972b85e3abbe98219a650906f377d473b19f58e10b8464ea53
      - name: Run isolated synthetic fixtures
        working-directory: .github/m6-react-python-closure
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -S -B test_qualify_react_python.py -v
