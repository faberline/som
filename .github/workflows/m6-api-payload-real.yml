name: M6 React API payload real live verifier fixture
on:
  push:
    branches: [codex/m6-api-execution-closure-20261029]
permissions:
  contents: read
  actions: read
jobs:
  fresh-offline-venv:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check synthetic adapter controls
        run: |
          python3 -I -S -B -c 'import runpy,sys; sys.path.insert(0,".github/m6-api-payload-fixture"); runpy.run_path(".github/m6-api-payload-fixture/synthetic_fixture.py",run_name="__main__")'
      - name: Bind the venv provision source before execution
        run: |
          set -eu
          path=.github/m6-venv-fixtures/provision_live.py
          expected=d912a1c4c88c84dd2c29af64713985b367fcf70dbfc173b8ca95c7b2d7539ef1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sha256sum "$path" | cut -d ' ' -f 1)" = "$expected"
          test "$(git show "$GITHUB_SHA:$path" | sha256sum | cut -d ' ' -f 1)" = "$expected"
          for entry in \
            'som-rs/scripts/hosted_readiness/product_runtime/reuse_runtime.py 2a92e2df47fb05e76677fbb84e9cbb7f12d07d90eb8019bd816b5fe6b5588598' \
            'som-rs/scripts/hosted_readiness/product_runtime/qualify_runtime.py f3c6f69e922ab0a8f27426a5f597c03f213d40be0fb7fc324ac33f1b48ae66f3' \
            'som-rs/scripts/hosted_readiness/product_runtime/runtime-bf3-qualification.json 4aaca5ef284440fd64bd50723619425201417937b4d635bb3c5d2d5835226b68' \
            'som-rs/scripts/hosted_readiness/product_runtime/runtime-bf3-byte-audit.json 7a2c04a65866474bd773b9722274c09c36646951fa7848d62e4b20b2cb94e75f' \
            'som-rs/scripts/hosted_readiness/product_runtime/source-pins.json a4208c342bc9e923509bc5ba7ce6a9a1adfe3143d55b6215f0a313b4833550b2'; do
            set -- $entry
            test "$(sha256sum "$GITHUB_WORKSPACE/$1" | cut -d ' ' -f 1)" = "$2"
            test "$(git show "$GITHUB_SHA:$1" | sha256sum | cut -d ' ' -f 1)" = "$2"
          done
      - name: Acquire and bind source and independent audit artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          d="$RUNNER_TEMP/react39-inputs"
          mkdir -m 700 "$d"
          gh api repos/faberline/som/actions/runs/40821432963 > "$d/source-run.json"
          gh api repos/faberline/som/actions/artifacts/12874482658 > "$d/source-artifact.json"
          gh api repos/faberline/som/actions/runs/40823392027 > "$d/audit-run.json"
          gh api repos/faberline/som/actions/artifacts/12875218806 > "$d/audit-artifact.json"
          jq -e '.id == 40821432963 and .head_sha == "071c55b0f02e2325a6f0993636d5330005b6a4fe" and .status == "completed" and .conclusion == "success" and .repository.id == 1390374878' "$d/source-run.json" >/dev/null
          jq -e '.id == 12874482658 and .expired == false and .digest == "sha256:d568ebe48167bec64b4d067f1e2e246b625e16852fc6201bef3689c13c7850bf" and .workflow_run.id == 40821432963 and .workflow_run.head_sha == "071c55b0f02e2325a6f0993636d5330005b6a4fe" and .workflow_run.repository_id == 1390374878' "$d/source-artifact.json" >/dev/null
          jq -e '.id == 40823392027 and .head_sha == "980fb40bde910d467bfcf125bbaade5b6009d033" and .status == "completed" and .conclusion == "success" and .repository.id == 1390374878' "$d/audit-run.json" >/dev/null
          jq -e '.id == 12875218806 and .expired == false and .digest == "sha256:6aa5750a1b98f0aff12e3145963b73f44cc1f087339905a8ebab8f0e659bbb00" and .workflow_run.id == 40823392027 and .workflow_run.head_sha == "980fb40bde910d467bfcf125bbaade5b6009d033" and .workflow_run.repository_id == 1390374878' "$d/audit-artifact.json" >/dev/null
          gh api repos/faberline/som/actions/artifacts/12874482658/zip > "$d/source.zip"
          gh api repos/faberline/som/actions/artifacts/12875218806/zip > "$d/audit.zip"
          test "$(sha256sum "$d/source.zip" | cut -d ' ' -f 1)" = d568ebe48167bec64b4d067f1e2e246b625e16852fc6201bef3689c13c7850bf
          test "$(sha256sum "$d/audit.zip" | cut -d ' ' -f 1)" = 6aa5750a1b98f0aff12e3145963b73f44cc1f087339905a8ebab8f0e659bbb00
          mkdir "$d/source" "$d/audit"
          unzip -q "$d/source.zip" -d "$d/source"
          unzip -q "$d/audit.zip" -d "$d/audit"
          test "$(sha256sum "$d/source/react-python-qa-closure.tar" | cut -d ' ' -f 1)" = 8a1ead27a72911acb9af76c622311c5924ad91073b3fc9a221a44db6a0dd4e3b
          test "$(sha256sum "$d/audit/react-python-independent-audit.json" | cut -d ' ' -f 1)" = 3fb0075a6795d4f4efcb0845f8ee05dcf16947f7e946954a02a3835677eb8389
      - name: Create runtime transport directory
        run: mkdir -m 700 "$RUNNER_TEMP/som-runtime-reuse-control"
      - name: Download source-qualified runtime artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: faberline/som
          run-id: '40740849594'
          artifact-ids: '12840425819'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/som-runtime-reuse-control/transport
      - name: Restore and verify qualified runtime
        working-directory: ${{ runner.temp }}/som-runtime-reuse-control
        env:
          SOM_RUNTIME_ACTIONS_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/reuse_runtime.py" --repo "$GITHUB_WORKSPACE" --source-revision "$GITHUB_SHA" --artifact-root "$RUNNER_TEMP/som-runtime-reuse-control/transport" --out "$RUNNER_TEMP/som-product-runtime-qualification"
      - name: Build and verify fresh offline React QA venv
        run: |
          "$RUNNER_TEMP/som-product-runtime-qualification/install/python/bin/python3.12" -I -S -B "$GITHUB_WORKSPACE/.github/m6-venv-fixtures/provision_live.py" --repo "$GITHUB_WORKSPACE" --source-revision "$GITHUB_SHA" --runtime "$RUNNER_TEMP/som-product-runtime-qualification" --out "$RUNNER_TEMP/som-react-python-closure" --tar "$RUNNER_TEMP/react39-inputs/source/react-python-qa-closure.tar" --audit "$RUNNER_TEMP/react39-inputs/audit/react-python-independent-audit.json"
      - name: Exercise actual live verifier with synthetic authority
        env:
          SOM_NATIVE_RUNTIME_ROOT: ${{ runner.temp }}/som-product-runtime-qualification
        run: |
          cp som-rs/contracts/react-output-v1/som-react-linux-api-profile.json "$RUNNER_TEMP/som-react-api-context.json"
          cp som-rs/contracts/react-output-v1/som-react-linux-qa-profile.json "$RUNNER_TEMP/som-react-linux-qa-profile.json"
          "$RUNNER_TEMP/som-product-runtime-qualification/install/python/bin/python3.12" -I -S -B -c 'import runpy,sys; sys.path.insert(0,".github/m6-api-payload-fixture"); runpy.run_path(".github/m6-api-payload-fixture/real_live_fixture.py",run_name="__main__")'
      # A same-job API test must use the live venv before the runner exits.
      # This standalone draft performs no product API test or acceptance.
      - name: Retain proof and failure evidence
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          paths=()
          for path in react39-inputs/source-run.json react39-inputs/source-artifact.json react39-inputs/audit-run.json react39-inputs/audit-artifact.json react39-inputs/audit/react-python-independent-audit.json som-react-python-closure/environments/react-api-qa/live-provision-receipt.json som-react-python-closure/environments/react-api-qa/live-installed-files.json som-react-python-closure/environments/react-api-qa/live-installed-metadata.json som-react-python-closure/probe-installed-metadata.py som-react-python-closure/logs som-product-runtime-qualification/receipt.json som-product-runtime-qualification/artifact-origin.json som-product-runtime-qualification/qualification-evidence som-product-runtime-qualification/logs; do
            if [ -e "$path" ]; then paths+=("$path"); fi
          done
          if [ "${#paths[@]}" -gt 0 ]; then
            tar -cf "$RUNNER_TEMP/react-live-venv-proof.tar" "${paths[@]}"
            sha256sum "$RUNNER_TEMP/react-live-venv-proof.tar" > "$RUNNER_TEMP/react-live-venv-proof.tar.sha256"
          fi
      - name: Upload proof and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: react-live-venv-proof
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/react-live-venv-proof.tar
            ${{ runner.temp }}/react-live-venv-proof.tar.sha256
