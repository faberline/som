name: Rust hosted readiness

on:
  pull_request:
    paths:
      - .github/workflows/rust-hosted-readiness.yml
      - som-rs/scripts/hosted_readiness/**
      - '!som-rs/scripts/hosted_readiness/evidence/**'
      - som-rs/Cargo.toml
      - som-rs/Cargo.lock
      - som-rs/src/**
      - som-rs/som-targets/Cargo.toml
      - som-rs/som-targets/Cargo.lock
      - som-rs/som-targets/src/**
      - som-code-python/data/blocks/**
      - som-code-python/data/block-contracts/**
      - som-core/data/**
      - som-core/block_templates/**
      - som-rs/examples/**
      - som-rs/scripts/rust_output_acceptance/**
      - som-rs/scripts/compiler_acceptance/**
      - som-rs/contracts/**
      - som-rs/tests/**
      - som-rs/behavior/**
      - som-rs/som-targets/qa/**
      - som-rs/evidence/rust-output-contract-*.json
      - som-rs/evidence/typescript-output-contract-*.json
      - som-core/scripts/**
      - LICENSE
  workflow_dispatch:
    inputs:
      rebuild_product_runtime:
        description: Rebuild the pinned native product runtime
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: rust-hosted-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-tests:
    name: Cargo tests (${{ matrix.package }}, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: compiler
            manifest: som-rs/Cargo.toml
          - package: targets
            manifest: som-rs/som-targets/Cargo.toml
    env:
      RUSTUP_TOOLCHAIN: 1.96.1
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '%s\n' "$TESTED_SHA" > tested-sha.txt
          printf 'CARGO_TARGET_DIR=%s/som-cargo-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install native Rust tools
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy 2>&1 | tee tool-install.log
          rustc -vV | tee tool-identity.log
          cargo -vV | tee -a tool-identity.log
          rustfmt --version | tee -a tool-identity.log
          sha256sum "$(rustup which rustc)" "$(rustup which cargo)" "$(rustup which rustfmt)" | tee -a tool-identity.log
      - name: Fetch locked public crates
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          cargo fetch --locked --manifest-path som-rs/Cargo.toml 2>&1 | tee cargo-fetch.log
          if [ "$MANIFEST" != som-rs/Cargo.toml ]; then
            cargo fetch --locked --manifest-path "$MANIFEST" 2>&1 | tee -a cargo-fetch.log
          fi
      - name: Provision verified native tools
        run: |
          python3 som-rs/scripts/hosted_readiness/provision_native.py \
            --manifest som-rs/contracts/native-tools-v1/artifacts.json \
            --out "$RUNNER_TEMP/som-native-tools" \
            --rustfmt "$(rustup which rustfmt)" 2>&1 | tee native-provision.log
          cat "$RUNNER_TEMP/som-native-tools/github.env" >> "$GITHUB_ENV"
      - name: Package compiler assets from tracked source
        run: |
          cargo run --locked --offline --manifest-path som-rs/Cargo.toml \
            --bin som-compiler-assets -- \
            --destination som-rs/compiler-assets/current \
            --formatter "$SOM_RUFF" 2>&1 | tee compiler-assets.log
      - name: Run the complete default-feature Cargo suite
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          cargo test --locked --offline --no-fail-fast --manifest-path "$MANIFEST" -- --test-threads=1 2>&1 | tee cargo-tests.log
      - name: Check tracked dependency locks
        if: always()
        run: git diff --exit-code -- som-rs/Cargo.lock som-rs/som-targets/Cargo.lock
      - name: Keep Cargo test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-${{ matrix.package }}-linux
          path: |
            tested-sha.txt
            tool-install.log
            tool-identity.log
            cargo-fetch.log
            cargo-tests.log
            native-provision.log
            compiler-assets.log
            ${{ runner.temp }}/som-native-tools/receipt.json
          if-no-files-found: error
          retention-days: 30

  fixture-tests:
    name: Readiness fixture tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 --version
          printf '%s\n' "$TESTED_SHA" > tested-sha.txt
      - name: Run isolated unit tests on GitHub
        run: |
          python3 -m unittest discover -s som-rs/scripts/hosted_readiness -p 'test_*.py' -v 2>&1 | tee unit-tests.log
      - name: Save fixture test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readiness-fixture-tests
          path: |
            tested-sha.txt
            unit-tests.log
          if-no-files-found: error
          retention-days: 14

  public-input-reconstruction:
    name: Public input reconstruction (partial scope)
    needs: fixture-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 --version 2>&1 | tee input-runner.log
          printf '%s\n' "$TESTED_SHA" > tested-sha.txt
      - name: Prove public input reconstruction without running products
        run: |
          python3 som-rs/scripts/hosted_readiness/reconstruct_public_inputs.py \
            --repo . \
            --goldens som-rs/scripts/hosted_readiness/inputs/public-golden-hashes-v1.json \
            --out "$RUNNER_TEMP/som-public-inputs" 2>&1 | tee -a input-runner.log
      - name: Prove the remaining public checked DSL without running products
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 som-rs/scripts/hosted_readiness/prove_checked_reference.py \
            --repo . \
            --tested-sha "$TESTED_SHA" \
            --out "$RUNNER_TEMP/som-quality-checked-proof" 2>&1 | tee -a input-runner.log
      - name: Map all frozen Rust requests without running the compiler
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 som-rs/scripts/hosted_readiness/map_rust_inputs.py \
            --repo . \
            --inputs "$RUNNER_TEMP/som-public-inputs" \
            --goldens som-rs/scripts/hosted_readiness/inputs/public-golden-hashes-v1.json \
            --tested-sha "$TESTED_SHA" \
            --out "$RUNNER_TEMP/som-rust-inputs" 2>&1 | tee -a input-runner.log
      - name: Complete paired Rust inputs and prove all accepted baseline request hashes
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 som-rs/scripts/hosted_readiness/complete_rust_inputs.py \
            --repo . \
            --inputs "$RUNNER_TEMP/som-public-inputs" \
            --goldens som-rs/scripts/hosted_readiness/inputs/public-golden-hashes-v1.json \
            --tested-sha "$TESTED_SHA" \
            --out "$RUNNER_TEMP/som-rust-complete-inputs" 2>&1 | tee -a input-runner.log
      - name: Keep public input proof and remaining blockers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-input-reconstruction
          path: |
            tested-sha.txt
            input-runner.log
            ${{ runner.temp }}/som-public-inputs
            ${{ runner.temp }}/som-quality-checked-proof
            ${{ runner.temp }}/som-rust-inputs
            ${{ runner.temp }}/som-rust-complete-inputs
          if-no-files-found: error
          retention-days: 14

  experimental-native-compile:
    name: Full Python and Rust compile and assembly (unsealed experiment)
    needs: [cargo-tests, public-input-reconstruction]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.96.1
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      RUST_BACKTRACE: 1
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '%s\n' "$TESTED_SHA" > tested-sha.txt
          printf 'CARGO_TARGET_DIR=%s/som-experimental-cargo-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Download this run's complete input proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-input-reconstruction
          path: ${{ runner.temp }}/som-input-artifact
      - name: Check the input artifact revision
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(cat "$RUNNER_TEMP/som-input-artifact/som/som/tested-sha.txt")" = "$TESTED_SHA"
          test -f "$RUNNER_TEMP/som-input-artifact/_temp/som-public-inputs/manifest.json"
          test -f "$RUNNER_TEMP/som-input-artifact/_temp/som-rust-complete-inputs/manifest.json"
      - name: Install the native Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt 2>&1 | tee experimental-tools.log
          rustc -vV | tee -a experimental-tools.log
          cargo -vV | tee -a experimental-tools.log
          rustfmt --version | tee -a experimental-tools.log
          sha256sum "$(rustup which rustc)" "$(rustup which cargo)" "$(rustup which rustfmt)" | tee -a experimental-tools.log
      - name: Fetch the unchanged compiler and target locks
        run: |
          cargo fetch --locked --manifest-path som-rs/Cargo.toml 2>&1 | tee experimental-fetch.log
          cargo fetch --locked --manifest-path som-rs/som-targets/Cargo.toml 2>&1 | tee -a experimental-fetch.log
      - name: Provision verified native tools
        run: |
          python3 som-rs/scripts/hosted_readiness/provision_native.py \
            --manifest som-rs/contracts/native-tools-v1/artifacts.json \
            --out "$RUNNER_TEMP/som-native-tools" \
            --rustfmt "$(rustup which rustfmt)" 2>&1 | tee experimental-native-provision.log
          cat "$RUNNER_TEMP/som-native-tools/github.env" >> "$GITHUB_ENV"
      - name: Package compiler assets from the tested source
        run: |
          cargo run --locked --offline --manifest-path som-rs/Cargo.toml \
            --bin som-compiler-assets -- \
            --destination som-rs/compiler-assets/current \
            --formatter "$SOM_RUFF" 2>&1 | tee experimental-assets.log
      - name: Build the target-aware candidate
        run: |
          cargo build --locked --offline --manifest-path som-rs/som-targets/Cargo.toml --bin som 2>&1 | tee experimental-build.log
          sha256sum "$CARGO_TARGET_DIR/debug/som" | tee -a experimental-build.log
      - name: Compare all compile replies and complete product files with the unsealed checker
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 som-rs/scripts/hosted_readiness/run_experimental_native_assembly.py \
            --repo . \
            --python-inputs "$RUNNER_TEMP/som-input-artifact/_temp/som-public-inputs" \
            --rust-inputs "$RUNNER_TEMP/som-input-artifact/_temp/som-rust-complete-inputs" \
            --checked-proof "$RUNNER_TEMP/som-input-artifact/_temp/som-quality-checked-proof" \
            --binary "$CARGO_TARGET_DIR/debug/som" \
            --assets "$GITHUB_WORKSPACE/som-rs/compiler-assets/current" \
            --ruff "$SOM_RUFF" --rustfmt "$SOM_RUSTFMT" \
            --node "$SOM_TS_NODE" --prettier "$SOM_TS_PRETTIER" \
            --tested-sha "$TESTED_SHA" --port 18976 \
            --out "$RUNNER_TEMP/som-unsealed-native-compile" 2>&1 | tee experimental-driver.log
      - name: Verify unchanged dependency locks
        if: always()
        run: git diff --exit-code -- som-rs/Cargo.lock som-rs/som-targets/Cargo.lock
      - name: Keep every exchange and the owned cleanup receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: experimental-unsealed-native-compile
          include-hidden-files: true
          path: |
            tested-sha.txt
            experimental-tools.log
            experimental-fetch.log
            experimental-native-provision.log
            experimental-assets.log
            experimental-build.log
            experimental-driver.log
            ${{ runner.temp }}/som-native-tools/receipt.json
            ${{ runner.temp }}/som-unsealed-native-compile
          if-no-files-found: error
          retention-days: 14

  frozen-readiness:
    name: Frozen product prerequisites (blocked until provisioned)
    needs: fixture-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: printf '%s\n' "$TESTED_SHA" > tested-sha.txt
      - name: Inspect frozen inputs without running products
        run: |
          python3 som-rs/scripts/hosted_readiness/preflight.py \
            --repo . \
            --manifest som-rs/scripts/hosted_readiness/readiness.json \
            --out .local/hosted-readiness/report.json
      - name: Save readiness report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frozen-product-readiness
          path: |
            .local/hosted-readiness/report.json
            tested-sha.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  product-runtime-source-qualification:
    name: Product runtime first-build qualification (not acceptance)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_product_runtime }}
    needs: fixture-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check synthetic integrity and path fixtures on GitHub
        working-directory: ${{ runner.temp }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          test_run="$RUNNER_TEMP/som-product-runtime-tests"
          mkdir -m 700 "$test_run"
          cd "$test_run"
          TMPDIR="$test_run" python3 -B \
            "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/test_qualify_runtime.py"
      - name: Build and inspect the pinned native runtime
        working-directory: ${{ runner.temp }}
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/qualify_runtime.py" \
            --repo "$GITHUB_WORKSPACE" \
            --manifest som-rs/scripts/hosted_readiness/product_runtime/source-pins.json \
            --out "$RUNNER_TEMP/som-product-runtime-qualification" \
            --source-revision "$TESTED_SHA"
      - name: Preserve qualification candidate and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-runtime-first-build-qualification
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/som-product-runtime-qualification/source-pins.json
            ${{ runner.temp }}/som-product-runtime-qualification/receipt.json
            ${{ runner.temp }}/som-product-runtime-qualification/logs
            ${{ runner.temp }}/som-product-runtime-qualification/licenses
            ${{ runner.temp }}/som-product-runtime-qualification/install
            ${{ runner.temp }}/som-product-runtime-qualification/installed-files.json
            ${{ runner.temp }}/som-product-runtime-qualification/build-intermediates.json

  product-python-environment-plan:
    name: Python environment inputs (not wheel or product acceptance)
    needs: [fixture-tests, experimental-native-compile]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check synthetic environment inputs on GitHub
        run: |
          python3 -B som-rs/scripts/hosted_readiness/product_python/test_qualify_python.py
      - name: Download this run's complete assembly evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: experimental-unsealed-native-compile
          path: ${{ runner.temp }}/som-python-input-artifact
      - name: Bind every product environment to frozen assembled bytes
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B som-rs/scripts/hosted_readiness/product_python/qualify_python.py \
            --repo "$GITHUB_WORKSPACE" --source-revision "$TESTED_SHA" \
            --out "$RUNNER_TEMP/som-product-python-environment-plan" \
            --assembly "$RUNNER_TEMP/som-python-input-artifact/_temp/som-unsealed-native-compile"
      - name: Preserve source plan and explicit remaining gates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-python-environment-inputs
          path: ${{ runner.temp }}/som-product-python-environment-plan
          if-no-files-found: error
          retention-days: 30

  product-cargo-closure:
    name: Complete Rust registry closure (product gates unrun)
    needs: experimental-native-compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Create an owned run and check synthetic integrity fixtures
        working-directory: ${{ runner.temp }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          closure_run="$RUNNER_TEMP/som-cargo-closure-run"
          mkdir -m 700 "$closure_run"
          printf 'created\n' > "$closure_run/stage.txt"
          mkdir -m 700 "$closure_run/tests"
          cd "$closure_run/tests"
          TMPDIR="$closure_run/tests" python3 -B \
            "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/test_provision_cargo.py"
      - name: Download this run's compile and assembly evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-unsealed-native-compile
          path: ${{ runner.temp }}/som-cargo-closure-run/input
      - name: Check the required real product consumer route
        working-directory: ${{ runner.temp }}/som-cargo-closure-run
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B - "$PWD" "$TESTED_SHA" <<'PY'
          import json, pathlib, sys
          run = pathlib.Path(sys.argv[1])
          root = run / "input/_temp/som-unsealed-native-compile"
          manifest = json.loads((root / "assembly/manifest.json").read_text())
          if manifest["tested_sha"] != sys.argv[2]:
              raise SystemExit("assembly artifact is not this candidate")
          products = manifest["products"]["rust"]
          references = {}
          for phase, identity in (("phase1", "example-v1"), ("phase2", "services14-0000")):
              rows = [row for row in products if (row["phase"], row["id"]) == (phase, identity)]
              if len(rows) != 1:
                  raise SystemExit("named real Cargo reference is missing")
              path = root / rows[0]["product_dir"]
              if not all((path / leaf).is_file() for leaf in ("src/main.rs", "Cargo.toml", "Cargo.lock")):
                  raise SystemExit("real generated Cargo reference target is missing")
              references[phase] = str(path)
          (run / "consumer-roots.json").write_text(json.dumps({"assembly_root": str(root), **references}))
          PY
      - name: Install exact Rust tools inside the owned run
        working-directory: ${{ runner.temp }}/som-cargo-closure-run
        run: |
          RUSTUP_HOME="$PWD/rustup" CARGO_HOME="$PWD/bootstrap-cargo" \
            rustup toolchain install 1.96.1 --profile minimal > rustup-install.log 2>&1
      - name: Make and verify all 352 registry packages
        working-directory: ${{ runner.temp }}/som-cargo-closure-run
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cargo_tool="$(RUSTUP_HOME="$PWD/rustup" CARGO_HOME="$PWD/bootstrap-cargo" rustup which --toolchain 1.96.1 cargo)"
          rustc_tool="$(RUSTUP_HOME="$PWD/rustup" CARGO_HOME="$PWD/bootstrap-cargo" rustup which --toolchain 1.96.1 rustc)"
          python3 -B - "$GITHUB_WORKSPACE" "$PWD" "$TESTED_SHA" "$cargo_tool" "$rustc_tool" <<'PY'
          import json, pathlib, subprocess, sys
          repo, run = map(pathlib.Path, sys.argv[1:3])
          refs = json.loads((run / "consumer-roots.json").read_text())
          subprocess.run([sys.executable, "-B", str(repo / "som-rs/scripts/hosted_readiness/product_runtime/provision_cargo.py"),
                          "--repo", str(repo), "--source-revision", sys.argv[3], "--out", str(run / "closure"),
                          "--cargo", sys.argv[4], "--rustc", sys.argv[5], "--assembly-root", refs["assembly_root"],
                          "--phase1-product-root", refs["phase1"], "--phase2-product-root", refs["phase2"]],
                         cwd=run, check=True)
          PY
      - name: Preserve registry closure candidate and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-cargo-closure-candidate
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/som-cargo-closure-run/stage.txt
            ${{ runner.temp }}/som-cargo-closure-run/consumer-roots.json
            ${{ runner.temp }}/som-cargo-closure-run/rustup-install.log
            ${{ runner.temp }}/som-cargo-closure-run/closure

  product-runtime-reuse:
    name: Audited runtime bytes for later GitHub tests (not product readiness)
    needs: [fixture-tests, experimental-native-compile]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Create the transport control directory and check synthetic fixtures
        working-directory: ${{ runner.temp }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          control="$RUNNER_TEMP/som-runtime-reuse-control"
          mkdir -m 700 "$control"
          mkdir -m 700 "$control/tests"
          printf 'created\n' > "$control/stage.txt"
          cd "$control/tests"
          TMPDIR="$control/tests" python3 -B \
            "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/test_reuse_runtime.py"
          TMPDIR="$control/tests" python3 -B \
            "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/test_qualify_runtime.py"
      - name: Download the exact controller-audited artifact from its original run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: faberline/som
          run-id: "40740849594"
          artifact-ids: "12840425819"
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/som-runtime-reuse-control/transport
      - name: Restore and recheck all qualified runtime bytes
        working-directory: ${{ runner.temp }}/som-runtime-reuse-control
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOM_RUNTIME_ACTIONS_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_runtime/reuse_runtime.py" \
            --repo "$GITHUB_WORKSPACE" \
            --source-revision "$TESTED_SHA" \
            --artifact-root "$RUNNER_TEMP/som-runtime-reuse-control/transport" \
            --out "$RUNNER_TEMP/som-product-runtime-qualification"
          cat "$RUNNER_TEMP/som-product-runtime-qualification/github.env" >> "$GITHUB_ENV"
      - name: Preserve reuse receipts and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-runtime-reuse-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/som-runtime-reuse-control/stage.txt
            ${{ runner.temp }}/som-product-runtime-qualification/receipt.json
            ${{ runner.temp }}/som-product-runtime-qualification/artifact-origin.json
            ${{ runner.temp }}/som-product-runtime-qualification/qualification-evidence
            ${{ runner.temp }}/som-product-runtime-qualification/licenses
            ${{ runner.temp }}/som-product-runtime-qualification/logs
            ${{ runner.temp }}/som-product-runtime-qualification/github.env
      - name: Download this run's complete owned assembly proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-unsealed-native-compile
          path: ${{ runner.temp }}/som-wheel-assembly-artifact
      - name: Bind the assembly artifact to this candidate
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(cat "$RUNNER_TEMP/som-wheel-assembly-artifact/som/som/tested-sha.txt")" = "$TESTED_SHA"
          test -f "$RUNNER_TEMP/som-wheel-assembly-artifact/_temp/som-unsealed-native-compile/assembly/manifest.json"
      - name: Run synthetic wheel and process integrity fixtures on GitHub
        working-directory: ${{ runner.temp }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          mkdir -m 700 "$RUNNER_TEMP/som-wheel-producer-tests"
          TMPDIR="$RUNNER_TEMP/som-wheel-producer-tests" \
            "$SOM_PRODUCT_PYTHON" -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_python/test_produce_wheels.py"
      - name: Read every frozen product environment input
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          "$SOM_PRODUCT_PYTHON" -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_python/qualify_python.py" \
            --repo "$GITHUB_WORKSPACE" --source-revision "$TESTED_SHA" \
            --assembly "$RUNNER_TEMP/som-wheel-assembly-artifact/_temp/som-unsealed-native-compile" \
            --out "$RUNNER_TEMP/som-wheel-environment-inputs"
      - name: Resolve and stream all named offline environment checks
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          "$SOM_PRODUCT_PYTHON" -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/product_python/produce_wheels.py" \
            --repo "$GITHUB_WORKSPACE" --source-revision "$TESTED_SHA" \
            --environments "$RUNNER_TEMP/som-wheel-environment-inputs" \
            --assembly "$RUNNER_TEMP/som-wheel-assembly-artifact/_temp/som-unsealed-native-compile" \
            --runtime "$RUNNER_TEMP/som-product-runtime-qualification" \
            --out "$RUNNER_TEMP/som-python-wheel-qualification"
      - name: Preserve wheel closure, failed environments and all receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-wheel-closure-qualification
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/som-wheel-environment-inputs
            ${{ runner.temp }}/som-python-wheel-qualification/receipt.json
            ${{ runner.temp }}/som-python-wheel-qualification/probe-installed-metadata.py
            ${{ runner.temp }}/som-python-wheel-qualification/logs
            ${{ runner.temp }}/som-python-wheel-qualification/environments
            ${{ runner.temp }}/som-python-wheel-qualification/closures/*/receipt.json
            ${{ runner.temp }}/som-python-wheel-qualification/closures/*/project
            ${{ runner.temp }}/som-python-wheel-qualification/closures/*/requirements.*
            ${{ runner.temp }}/som-python-wheel-qualification/closures/*/publisher-metadata
            ${{ runner.temp }}/som-python-wheel-qualification/closures/*/wheels
            ${{ runner.temp }}/som-python-wheel-qualification/closures/*/wheel-audits
