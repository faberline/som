name: Rust hosted readiness

on:
  pull_request:
    paths:
      - .github/workflows/rust-hosted-readiness.yml
      - .github/workflows/rust-dependency-preparation.yml
      - som-rs/scripts/hosted_readiness/**
      - '!som-rs/scripts/hosted_readiness/evidence/**'
      - som-rs/Cargo.toml
      - som-rs/Cargo.lock
      - som-rs/src/**
      - som-rs/som-targets/Cargo.toml
      - som-rs/som-targets/Cargo.lock
      - som-rs/som-targets/src/**
      - som-code-python/data/blocks/**
      - som-code-python/data/block-contracts/**
      - som-core/data/**
      - som-core/block_templates/**
      - som-rs/examples/**
      - som-rs/scripts/rust_output_acceptance/**
      - som-rs/scripts/compiler_acceptance/**
      - som-rs/contracts/**
      - som-rs/tests/**
      - som-rs/behavior/**
      - som-rs/som-targets/qa/**
      - som-rs/evidence/rust-output-contract-*.json
      - som-rs/evidence/typescript-output-contract-*.json
      - som-core/scripts/**
      - LICENSE
  workflow_dispatch:
    inputs:
      dependency_preparation_only:
        description: Reuse the reviewed candidate for dependency helper iteration only
        type: boolean
        default: false
      rebuild_product_runtime:
        description: Rebuild the pinned native product runtime
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: rust-hosted-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HELPER_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  candidate-source-guard:
    name: Select a full candidate or pinned dependency iteration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run_full_candidate: ${{ steps.select.outputs.run_full_candidate }}
      candidate_revision: ${{ steps.select.outputs.candidate_revision }}
      helper_revision: ${{ steps.select.outputs.helper_revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch the exact recorded source as Git metadata only
        run: git fetch --no-tags --depth=1 origin f59e28d910ff4adb16e3becfdc82bd2978ca84fa
      - name: Classify complete candidate inputs without building
        id: select
        env:
          HELPER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          DEPENDENCY_ONLY: ${{ inputs.dependency_preparation_only || false }}
          SOM_DEPENDENCY_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          mode=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$DEPENDENCY_ONLY" = "true" ]; then
              mode="--dependency-only"
            else
              mode="--force-full"
            fi
          fi
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/dependency_candidate.py -- classify \
            --repo "$GITHUB_WORKSPACE" --helper-revision "$HELPER_SHA" $mode

  dependency-preparation:
    name: Dependency helper iteration with recorded compiler identity
    needs: [candidate-source-guard, fixture-tests]
    if: needs.candidate-source-guard.outputs.run_full_candidate == 'false'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rust-dependency-preparation.yml
    with:
      helper_revision: ${{ needs.candidate-source-guard.outputs.helper_revision }}

  cargo-tests:
    needs: candidate-source-guard
    if: needs.candidate-source-guard.outputs.run_full_candidate == 'true'
    name: Cargo tests (${{ matrix.package }}, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: compiler
            manifest: som-rs/Cargo.toml
          - package: targets
            manifest: som-rs/som-targets/Cargo.toml
    env:
      RUSTUP_TOOLCHAIN: 1.96.1
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '%s\n' "$TESTED_SHA" > tested-sha.txt
          printf 'CARGO_TARGET_DIR=%s/som-cargo-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install native Rust tools
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy 2>&1 | tee tool-install.log
          rustc -vV | tee tool-identity.log
          cargo -vV | tee -a tool-identity.log
          rustfmt --version | tee -a tool-identity.log
          sha256sum "$(rustup which rustc)" "$(rustup which cargo)" "$(rustup which rustfmt)" | tee -a tool-identity.log
      - name: Fetch locked public crates
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          cargo fetch --locked --manifest-path som-rs/Cargo.toml 2>&1 | tee cargo-fetch.log
          if [ "$MANIFEST" != som-rs/Cargo.toml ]; then
            cargo fetch --locked --manifest-path "$MANIFEST" 2>&1 | tee -a cargo-fetch.log
          fi
      - name: Provision verified native tools
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/provision_native.py -- \
            --manifest som-rs/contracts/native-tools-v1/artifacts.json \
            --out "$RUNNER_TEMP/som-native-tools" \
            --rustfmt "$(rustup which rustfmt)" 2>&1 | tee native-provision.log
          cat "$RUNNER_TEMP/som-native-tools/github.env" >> "$GITHUB_ENV"
      - name: Package compiler assets from tracked source
        run: |
          cargo run --locked --offline --manifest-path som-rs/Cargo.toml \
            --bin som-compiler-assets -- \
            --destination som-rs/compiler-assets/current \
            --formatter "$SOM_RUFF" 2>&1 | tee compiler-assets.log
      - name: Run the complete default-feature Cargo suite
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          cargo test --locked --offline --no-fail-fast --manifest-path "$MANIFEST" -- --test-threads=1 2>&1 | tee cargo-tests.log
      - name: Check tracked dependency locks
        if: always()
        run: git diff --exit-code -- som-rs/Cargo.lock som-rs/som-targets/Cargo.lock
      - name: Keep Cargo test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-${{ matrix.package }}-linux
          path: |
            tested-sha.txt
            tool-install.log
            tool-identity.log
            cargo-fetch.log
            cargo-tests.log
            native-provision.log
            compiler-assets.log
            ${{ runner.temp }}/som-native-tools/receipt.json
          if-no-files-found: error
          retention-days: 30

  fixture-tests:
    name: Readiness fixture tests
    env:
      HELPER_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 --version
          printf '%s\n' "$TESTED_SHA" > tested-sha.txt
      - name: Run every source fixture file in a fresh checked Python process
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/run_source_fixtures.py -- --repo "$GITHUB_WORKSPACE" --helper-revision "$HELPER_REVISION" --out "$RUNNER_TEMP/som-main-source-fixtures" 2>&1 | tee unit-tests.log
      - name: Keep all 34 current input source fixtures required
        if: always()
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/product_runtime/test_current_input_context.py -- -v 2>&1 | tee current-context-fixtures.log
      - name: Save fixture test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readiness-fixture-tests
          path: |
            tested-sha.txt
            unit-tests.log
            current-context-fixtures.log
            ${{ runner.temp }}/som-main-source-fixtures
          if-no-files-found: error
          retention-days: 14

  public-input-reconstruction:
    if: needs.candidate-source-guard.outputs.run_full_candidate == 'true'
    name: Public input reconstruction (partial scope)
    needs: [fixture-tests, candidate-source-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.publish-public.outputs.artifact-id }}
      artifact_digest: ${{ steps.publish-public.outputs.artifact-digest }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 --version 2>&1 | tee input-runner.log
          printf '%s\n' "$TESTED_SHA" > tested-sha.txt
      - name: Prove public input reconstruction without running products
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/reconstruct_public_inputs.py -- \
            --repo . \
            --goldens som-rs/scripts/hosted_readiness/inputs/public-golden-hashes-v1.json \
            --out "$RUNNER_TEMP/som-public-inputs" 2>&1 | tee -a input-runner.log
      - name: Prove the remaining public checked DSL without running products
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/prove_checked_reference.py -- \
            --repo . \
            --tested-sha "$TESTED_SHA" \
            --out "$RUNNER_TEMP/som-quality-checked-proof" 2>&1 | tee -a input-runner.log
      - name: Map all frozen Rust requests without running the compiler
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/map_rust_inputs.py -- \
            --repo . \
            --inputs "$RUNNER_TEMP/som-public-inputs" \
            --goldens som-rs/scripts/hosted_readiness/inputs/public-golden-hashes-v1.json \
            --tested-sha "$TESTED_SHA" \
            --out "$RUNNER_TEMP/som-rust-inputs" 2>&1 | tee -a input-runner.log
      - name: Complete paired Rust inputs and prove all accepted baseline request hashes
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/complete_rust_inputs.py -- \
            --repo . \
            --inputs "$RUNNER_TEMP/som-public-inputs" \
            --goldens som-rs/scripts/hosted_readiness/inputs/public-golden-hashes-v1.json \
            --tested-sha "$TESTED_SHA" \
            --out "$RUNNER_TEMP/som-rust-complete-inputs" 2>&1 | tee -a input-runner.log
      - name: Keep public input proof and remaining blockers
        id: publish-public
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-input-reconstruction
          path: |
            tested-sha.txt
            input-runner.log
            ${{ runner.temp }}/som-public-inputs
            ${{ runner.temp }}/som-quality-checked-proof
            ${{ runner.temp }}/som-rust-inputs
            ${{ runner.temp }}/som-rust-complete-inputs
          if-no-files-found: error
          retention-days: 14

  experimental-native-compile:
    name: Full Python and Rust compile and assembly (unsealed experiment)
    outputs:
      assembly_id: ${{ steps.publish-assembly.outputs.artifact-id }}
      assembly_digest: ${{ steps.publish-assembly.outputs.artifact-digest }}
      carrier_id: ${{ steps.publish-carrier.outputs.artifact-id }}
      carrier_digest: ${{ steps.publish-carrier.outputs.artifact-digest }}
    needs: [cargo-tests, public-input-reconstruction, candidate-source-guard]
    if: needs.candidate-source-guard.outputs.run_full_candidate == 'true'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.96.1
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      RUST_BACKTRACE: 1
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '%s\n' "$TESTED_SHA" > tested-sha.txt
          printf 'CARGO_TARGET_DIR=%s/som-experimental-cargo-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Bind the actual formal workflow source before native QA helpers
        env:
          SOM_DEPENDENCY_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/same_candidate_graph.py -- admit --repo "$GITHUB_WORKSPACE" --helper-revision "$HELPER_REVISION" --candidate-revision "$HELPER_REVISION" --out "$RUNNER_TEMP/formal-build-source-admission.json"
      - name: Download this run's complete input proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-input-reconstruction
          path: ${{ runner.temp }}/som-input-artifact
      - name: Check the input artifact revision
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(cat "$RUNNER_TEMP/som-input-artifact/som/som/tested-sha.txt")" = "$TESTED_SHA"
          test -f "$RUNNER_TEMP/som-input-artifact/_temp/som-public-inputs/manifest.json"
          test -f "$RUNNER_TEMP/som-input-artifact/_temp/som-rust-complete-inputs/manifest.json"
      - name: Install the native Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt 2>&1 | tee experimental-tools.log
          rustc -vV | tee -a experimental-tools.log
          cargo -vV | tee -a experimental-tools.log
          rustfmt --version | tee -a experimental-tools.log
          sha256sum "$(rustup which rustc)" "$(rustup which cargo)" "$(rustup which rustfmt)" | tee -a experimental-tools.log
      - name: Fetch the unchanged compiler and target locks
        run: |
          cargo fetch --locked --manifest-path som-rs/Cargo.toml 2>&1 | tee experimental-fetch.log
          cargo fetch --locked --manifest-path som-rs/som-targets/Cargo.toml 2>&1 | tee -a experimental-fetch.log
      - name: Provision verified native tools
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/provision_native.py -- \
            --manifest som-rs/contracts/native-tools-v1/artifacts.json \
            --out "$RUNNER_TEMP/som-native-tools" \
            --rustfmt "$(rustup which rustfmt)" 2>&1 | tee experimental-native-provision.log
          cat "$RUNNER_TEMP/som-native-tools/github.env" >> "$GITHUB_ENV"
      - name: Bind exact source and native tool roles before the one actual candidate build
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/product_runtime/current_candidate_layout.py -- begin --repo "$GITHUB_WORKSPACE" --helper-revision "$HELPER_REVISION" --candidate-revision "$HELPER_REVISION" --cargo "$(rustup which cargo)" --rustc "$(rustup which rustc)" --ruff "$SOM_RUFF" --rustfmt "$SOM_RUSTFMT" --node "$SOM_TS_NODE" --prettier "$SOM_TS_PRETTIER" --target-dir "$CARGO_TARGET_DIR" --assets "$GITHUB_WORKSPACE/som-rs/compiler-assets/current"
      - name: Package compiler assets from the tested source
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/product_runtime/current_candidate_layout.py -- command --repo "$GITHUB_WORKSPACE" --helper-revision "$HELPER_REVISION" --candidate-revision "$HELPER_REVISION" --stage assets -- "$(rustup which cargo)" run --locked --offline --manifest-path som-rs/Cargo.toml --bin som-compiler-assets -- --destination som-rs/compiler-assets/current --formatter "$SOM_RUFF" 2>&1 | tee experimental-assets.log
      - name: Build the target-aware candidate
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/product_runtime/current_candidate_layout.py -- command --repo "$GITHUB_WORKSPACE" --helper-revision "$HELPER_REVISION" --candidate-revision "$HELPER_REVISION" --stage candidate -- "$(rustup which cargo)" build --locked --offline --manifest-path som-rs/som-targets/Cargo.toml --bin som 2>&1 | tee experimental-build.log
          sha256sum "$CARGO_TARGET_DIR/debug/som" | tee -a experimental-build.log
      - name: Compare all compile replies and complete product files with the unsealed checker
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/run_experimental_native_assembly.py -- \
            --repo . \
            --python-inputs "$RUNNER_TEMP/som-input-artifact/_temp/som-public-inputs" \
            --rust-inputs "$RUNNER_TEMP/som-input-artifact/_temp/som-rust-complete-inputs" \
            --checked-proof "$RUNNER_TEMP/som-input-artifact/_temp/som-quality-checked-proof" \
            --binary "$CARGO_TARGET_DIR/debug/som" \
            --assets "$GITHUB_WORKSPACE/som-rs/compiler-assets/current" \
            --ruff "$SOM_RUFF" --rustfmt "$SOM_RUSTFMT" \
            --node "$SOM_TS_NODE" --prettier "$SOM_TS_PRETTIER" \
            --tested-sha "$TESTED_SHA" --port 18976 \
            --out "$RUNNER_TEMP/som-unsealed-native-compile" 2>&1 | tee experimental-driver.log
      - name: Finish the original build provenance against the actual2041 and2045 proof
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/product_runtime/current_candidate_layout.py -- finish --repo "$GITHUB_WORKSPACE" --helper-revision "$HELPER_REVISION" --candidate-revision "$HELPER_REVISION" --assembly-root "$RUNNER_TEMP/som-unsealed-native-compile"
      - name: Stage the exact current same-job tested binary and Rustfmt
        env:
          HELPER_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/product_runtime/stage_candidate_carrier.py -- --binary "$CARGO_TARGET_DIR/debug/som" --rustfmt "$SOM_RUSTFMT" --compile-manifest "$RUNNER_TEMP/som-unsealed-native-compile/manifest.json" --candidate-revision "$HELPER_REVISION" --out "$RUNNER_TEMP/som-current-carrier-inputs"
      - name: Pack the current tested bytes without a rebuild role
        env:
          HELPER_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I -S -B "$GITHUB_WORKSPACE/som-rs/scripts/hosted_readiness/bound_source.py" --repo "$GITHUB_WORKSPACE" --revision "$HELPER_REVISION" --entry som-rs/scripts/hosted_readiness/product_runtime/candidate_carrier.py -- --candidate-revision "$HELPER_REVISION" --compile-manifest "$RUNNER_TEMP/som-unsealed-native-compile/manifest.json" --binary "$RUNNER_TEMP/som-current-carrier-inputs/binary" --assets "$GITHUB_WORKSPACE/som-rs/compiler-assets/current" --native "$RUNNER_TEMP/som-native-tools" --rustfmt "$RUNNER_TEMP/som-current-carrier-inputs/rustfmt" --out "$RUNNER_TEMP/som-current-carrier"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: publish-carrier
        if: always()
        with:
          name: same-job-current-candidate-carrier
          path: ${{ runner.temp }}/som-current-carrier
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Verify unchanged dependency locks
        if: always()
        run: git diff --exit-code -- som-rs/Cargo.lock som-rs/som-targets/Cargo.lock
      - name: Keep every exchange and the owned cleanup receipt
        id: publish-assembly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: experimental-unsealed-native-compile
          include-hidden-files: true
          path: |
            tested-sha.txt
            experimental-tools.log
            experimental-fetch.log
            experimental-native-provision.log
            experimental-assets.log
            experimental-build.log
            experimental-driver.log
            ${{ runner.temp }}/som-native-tools/receipt.json
            ${{ runner.temp }}/som-unsealed-native-compile
            ${{ runner.temp }}/som-current-build-provenance
          if-no-files-found: error
          retention-days: 14

  frozen-readiness:
    name: Frozen product prerequisites (blocked until provisioned)
    needs: fixture-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: printf '%s\n' "$TESTED_SHA" > tested-sha.txt
      - name: Inspect frozen inputs without running products
        run: |
