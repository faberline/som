name: M6 React003 map calculator fixtures (not acceptance)
on:
  push:
    branches:
      - codex/m6-react003-map-fixtures-20261029
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind and test draft map calculator
        working-directory: .github/m6-react003-calculator
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for entry in \
            'react003_map.py 1e211304fc5be82ef27cab1434571f535bfe5039087a85002093c7f1ea393595' \
            'test_react003_map.py 94d4f281c50ff930517e6c8b5d7bc876c3370145cf804602b725ab6f8fe7c452' \
            'plan.example.json f02e57df4b20254e5cea22ebcb4b468340c8e8b802e2256a11e6c5a3c3041dfa' \
            'qa-profile.path-order.draft.json 5e2e4852b32e8bdc5b60ad60e50fb8e6a235690334848c13fb29ca55cb0d6c00'; do
            set -- $entry
            test "$(sha256sum "$1" | cut -d ' ' -f 1)" = "$2"
            test "$(git show "$GITHUB_SHA:.github/m6-react003-calculator/$1" | sha256sum | cut -d ' ' -f 1)" = "$2"
          done
          python3 -m unittest -v test_react003_map
