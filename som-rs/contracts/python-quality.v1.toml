[tool.ruff]
target-version = "py312"
line-length = 79
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ARG", "C4", "A", "ANN", "RUF", "PGH"]

[tool.ruff.lint.isort]
known-first-party = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_unimported = true
disallow_any_explicit = true
show_error_codes = true
pretty = false

[tool.pylint.format]
max-line-length = 79

[tool.isort]
profile = "black"
line_length = 79
combine_as_imports = true
force_sort_within_sections = false
