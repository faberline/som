[package]
name = "som_app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.44", default-features = false, features = ["clock", "serde", "std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib"] }
hmac = "=0.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
mongodb = { version = "=3.9.1", default-features = false, features = ["compat-3-0-0", "dns-resolver", "rustls-tls"] }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "preserve_order"] }
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["chrono", "derive", "json", "macros", "migrate", "postgres", "runtime-tokio"] }
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
