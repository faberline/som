[package]
name = "som_app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "=0.4.44", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.8.6", default-features = false, features = ["chrono", "derive", "macros", "migrate", "postgres", "runtime-tokio"] }
tokio = { version = "=1.53.3", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
http-body-util = "=0.1.5"
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
