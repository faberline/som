[package]
name = "som-targets"
version = "0.1.0"
edition = "2024"
publish = false
description = "Target-aware SOM compiler service around the unchanged compiler-v1 library"

# The som library is a path dependency and stays byte-identical.
# Its backend descriptor hashes its own sources, so Python bundles keep their bytes.
[dependencies]
som = { path = ".." }
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }

[[bin]]
name = "som"
path = "src/main.rs"
