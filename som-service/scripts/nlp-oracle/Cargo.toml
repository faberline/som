[package]
name = "som-service-nlp-compatibility"
version = "0.1.0"
edition = "2024"
publish = false

# baseline: the historical nlp revision that som-rs still pins; candidate: the cnl crate in this repository.
[dependencies]
baseline = { package = "faberline-nlp-cnl", git = "https://github.com/faberline/nlp.git", rev = "8ddb1f6df55eec0764ca50772b2c038441361727" }
candidate = { package = "faberline-nlp-cnl", path = "../../cnl" }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

