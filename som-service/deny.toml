[graph]
all-features = false

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "Unlicense", "OpenSSL", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8
[licenses.private]
ignore = true
[[licenses.clarify]]
crate = "cli-std"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "metrics-prometheus"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "server-http"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "server-lifecycle"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "server-tcp"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "service-http"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "service-observability"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "transport-h2c"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/faberline/nlp.git", "https://github.com/faberline/core"]
