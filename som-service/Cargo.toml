[package]
name = "som-service"
version = "0.1.0"
edition = "2024"
default-run = "som-service"
publish = false

[dependencies]
axum = "=0.8.9"
clap = { version = "=4.6.7", features = ["derive"] }
faberline-nlp-cnl = { git = "https://github.com/faberline/nlp.git", rev = "2f7e519d4037033d0ef69629c8f8bdfba837794a" }
openapi-codegen = { git = "https://github.com/faberline/core", tag = "v0.5.0" }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
server-lifecycle = { git = "https://github.com/faberline/core", tag = "v0.5.0" }
service-http = { git = "https://github.com/faberline/core", tag = "v0.5.0" }
sha2 = "=0.10.9"
tokio = { version = "=1.53.3",features = ["macros", "rt-multi-thread", "net", "sync"] }

[dev-dependencies]
proptest = "=1.7.0"
